<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>one_piece · swarm telemetry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
	--paper: oklch(97.6% 0.007 85);
	--panel: oklch(99.2% 0.004 85);
	--wash: oklch(94.6% 0.009 80);
	--line: oklch(89.5% 0.009 80);
	--line-2: oklch(83% 0.01 80);
	--ink: oklch(23% 0.014 65);
	--ink-2: oklch(43% 0.013 65);
	--ink-3: oklch(60% 0.011 70);
	--run: oklch(54% 0.15 258);
	--park: oklch(57% 0.075 300);
	--done: oklch(55% 0.11 152);
	--cut: oklch(57% 0.17 33);
	--still: oklch(72% 0.012 80);
	--wait: oklch(70% 0.12 75);
	--focus: oklch(70% 0.15 68);
	--focus-soft: oklch(70% 0.15 68 / 0.16);
	--serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
	--sans: "Instrument Sans", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
	--code: ui-monospace, "SF Mono", Menlo, monospace;
	--ease: cubic-bezier(0.22, 1, 0.36, 1);
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root {
		--paper: oklch(18.5% 0.009 70); --panel: oklch(21.5% 0.009 70); --wash: oklch(25% 0.01 70);
		--line: oklch(30% 0.01 70); --line-2: oklch(37% 0.012 70);
		--ink: oklch(93% 0.008 85); --ink-2: oklch(76% 0.01 80); --ink-3: oklch(60% 0.01 80);
		--run: oklch(70% 0.13 258); --park: oklch(70% 0.07 300); --done: oklch(70% 0.12 152);
		--cut: oklch(68% 0.15 33); --still: oklch(52% 0.012 80); --wait: oklch(78% 0.12 75);
		--focus: oklch(80% 0.14 75); --focus-soft: oklch(80% 0.14 75 / 0.18);
		color-scheme: dark;
	}
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: var(--run); }
.num { font-variant-numeric: tabular-nums; }
.code { font-family: var(--code); font-size: 12px; }
.dim { color: var(--ink-3); }
.soft { color: var(--ink-2); }

/* ---------- top bar ---------- */
.top { height: 60px; display: flex; align-items: center; gap: 22px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-family: var(--serif); font-size: 25px; letter-spacing: -0.01em; line-height: 1; white-space: nowrap; }
.brand i { color: var(--ink-3); }
.runpick { display: flex; flex-direction: column; min-width: 0; }
.runpick label { font-size: 11px; color: var(--ink-3); letter-spacing: .02em; }
.runpick select { appearance: none; border: 0; background: none; font: 600 14px var(--sans); color: var(--ink); padding: 0 18px 0 0; max-width: 360px; text-overflow: ellipsis; cursor: pointer;
	background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 7px) 9px, calc(100% - 3px) 9px; background-size: 4px 4px; background-repeat: no-repeat; }
.strip { display: flex; gap: 26px; margin-left: auto; align-items: center; }
.metric { display: flex; flex-direction: column; line-height: 1.15; }
.metric b { font-size: 17px; font-weight: 600; }
.metric span { font-size: 11px; color: var(--ink-3); }
.meter { width: 120px; height: 5px; background: var(--wash); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 3px; transition: width .6s var(--ease); }
.meter.warn i { background: var(--wait); }
.ask-btn { border: 1px solid var(--wait); background: color-mix(in oklch, var(--wait) 14%, var(--panel)); color: var(--ink); border-radius: 999px; padding: 5px 12px; font-weight: 600; cursor: pointer; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--wash); color: var(--ink-2); white-space: nowrap; line-height: 1.6; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--still); }
.s-running { --c: var(--run); } .s-parked { --c: var(--park); } .s-done { --c: var(--done); } .s-cut, .s-failed { --c: var(--cut); }
.s-merged, .s-archived { --c: var(--still); } .s-pending { --c: var(--line-2); }
.s-accepted { --c: var(--done); } .s-rejected { --c: var(--cut); } .s-needs_work, .s-pending_review { --c: var(--wait); } .s-unreviewed { --c: var(--still); }
.chip.st { background: color-mix(in oklch, var(--c, var(--still)) 13%, transparent); color: color-mix(in oklch, var(--c, var(--ink-2)) 80%, var(--ink)); }
.chip.st .dot, .dot.st { background: var(--c, var(--still)); }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 188px minmax(0, 1fr) auto; height: calc(100vh - 60px); }
.rail { border-right: 1px solid var(--line); padding: 18px 10px; display: flex; flex-direction: column; gap: 2px; background: var(--paper); overflow: auto; }
.rail button { display: flex; align-items: center; justify-content: space-between; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 7px; color: var(--ink-2); cursor: pointer; font-weight: 500; }
.rail button:hover { background: var(--wash); color: var(--ink); }
.rail button.on { background: var(--ink); color: var(--paper); }
.rail button .n { font-size: 11px; color: var(--ink-3); }
.rail button.on .n { color: color-mix(in oklch, var(--paper) 70%, transparent); }
.rail button .n.hot { background: var(--wait); color: var(--ink); border-radius: 999px; padding: 0 7px; }
.rail .sep { height: 1px; background: var(--line); margin: 12px 6px; }
.rail .legend { padding: 4px 10px; font-size: 12px; color: var(--ink-3); display: grid; gap: 5px; }
.rail .legend div { display: flex; align-items: center; gap: 8px; }
.stage { position: relative; overflow: auto; min-width: 0; }
.page { padding: 26px clamp(20px, 3vw, 40px) 60px; max-width: 1180px; }
h1.view { font-family: var(--serif); font-weight: 400; font-size: 34px; letter-spacing: -0.015em; margin: 0 0 4px; }
.lede { color: var(--ink-2); margin: 0 0 26px; max-width: 70ch; }
h3 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 30px 0 12px; }
.empty { color: var(--ink-3); padding: 30px 0; max-width: 56ch; }

/* ---------- graph ---------- */
.graph { position: absolute; inset: 0; overflow: hidden; background:
	radial-gradient(circle at 1px 1px, color-mix(in oklch, var(--ink) 7%, transparent) 1px, transparent 0) 0 0 / 22px 22px, var(--paper); cursor: grab; }
.graph.drag { cursor: grabbing; }
.graph svg { width: 100%; height: 100%; display: block; }
.ring { fill: none; stroke: var(--line); stroke-dasharray: 2 5; }
.link { fill: none; stroke: var(--line-2); stroke-width: 1.3; transition: opacity .3s; }
.link.hi { stroke: var(--focus); stroke-width: 2.2; }
.gnode { cursor: pointer; transition: opacity .3s var(--ease); }
.gnode .body { stroke-width: 2; transition: r .5s var(--ease); }
.gnode.leaf .body { fill: var(--c); stroke: var(--panel); }
.gnode.internal .body { fill: color-mix(in oklch, var(--c) 18%, var(--panel)); stroke: var(--c); stroke-width: 2.6; }
.gnode.root .body { fill: var(--panel); stroke: var(--c); stroke-width: 3; }
.gnode.root .core { fill: var(--c); }
.gnode .halo { fill: none; stroke: var(--focus); stroke-width: 3; opacity: 0; transition: opacity .2s; }
.gnode.sel .halo { opacity: 1; }
.gnode:hover .body { filter: brightness(1.06); }
.gnode .orbit { fill: none; stroke: var(--c); stroke-width: 1.2; stroke-dasharray: 3 4; opacity: .75; transform-box: fill-box; transform-origin: center; animation: spin 6s linear infinite; }
.gnode .sat { fill: var(--wait); stroke: var(--panel); stroke-width: 1; }
.glabel { font-size: 11.5px; fill: var(--ink-2); pointer-events: none; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.glabel.strong { fill: var(--ink); font-weight: 600; }
.gsub { font-size: 10.5px; fill: var(--ink-3); pointer-events: none; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; }
.faded { opacity: .18; }
.rnode { cursor: pointer; transition: opacity .3s var(--ease); }
.rnode .rbody { fill: color-mix(in oklch, var(--c) 22%, var(--panel)); stroke: var(--c); stroke-width: 1.6; }
.rnode.s-running .rbody { fill: var(--c); }
.rnode text { font-size: 8.5px; font-weight: 700; fill: var(--ink); pointer-events: none; text-anchor: middle; }
.rnode.s-running text { fill: var(--panel); }
.rnode.sel .rhalo { opacity: 1; }
.rnode .rhalo { fill: none; stroke: var(--focus); stroke-width: 2.5; opacity: 0; }
.rnode.old { opacity: .55; }
.rlink { fill: none; stroke: var(--wait); stroke-width: 1.1; stroke-dasharray: 3 3; opacity: .8; }
.rlink.old { opacity: .3; }
.famband { fill: var(--focus-soft); stroke: var(--focus); stroke-width: 1; stroke-dasharray: 4 4; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .gnode .orbit { animation: none; } * { transition: none !important; } }
.gtools { position: absolute; left: 16px; top: 14px; display: flex; gap: 8px; align-items: center; z-index: 2; flex-wrap: wrap; }
.gtools .group { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.gtools .group button { border: 0; background: none; padding: 5px 10px; cursor: pointer; color: var(--ink-2); }
.gtools .group button + button { border-left: 1px solid var(--line); }
.gtools .group button:hover { background: var(--wash); color: var(--ink); }
.gtools .group button.on { background: var(--ink); color: var(--paper); }
.famtag { background: var(--focus-soft); border: 1px solid var(--focus); border-radius: 8px; padding: 4px 6px 4px 10px; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.famtag button { border: 0; background: none; cursor: pointer; color: var(--ink-2); padding: 0 4px; font-size: 15px; line-height: 1; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); padding: 8px 10px; border-radius: 8px; font-size: 12px; max-width: 300px; z-index: 5; opacity: 0; transform: translateY(4px); transition: opacity .12s, transform .12s; }
.tip.on { opacity: 1; transform: none; }
.tip b { display: block; font-size: 13px; margin-bottom: 2px; }
.gfoot { position: absolute; left: 16px; bottom: 14px; font-size: 12px; color: var(--ink-3); z-index: 2; background: color-mix(in oklch, var(--paper) 85%, transparent); padding: 4px 8px; border-radius: 6px; }

/* ---------- drawer ---------- */
.drawer { width: 0; overflow: hidden; border-left: 1px solid var(--line); background: var(--panel); transition: width .35s var(--ease); }
.drawer.open { width: min(460px, 42vw); }
.drawer .inner { width: min(460px, 42vw); height: 100%; display: flex; flex-direction: column; }
.dhead { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.dhead .kicker { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-3); }
.dhead h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.15; margin: 6px 0 4px; }
.dhead .close { margin-left: auto; border: 0; background: none; font-size: 20px; color: var(--ink-3); cursor: pointer; padding: 0 2px; }
.tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 9px; color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tabs button.on { color: var(--ink); border-color: var(--ink); }
.dbody { padding: 16px 20px 40px; overflow: auto; flex: 1; }
.kv { display: grid; grid-template-columns: 104px 1fr; gap: 7px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.prose { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; color: var(--ink); }
.box { background: var(--wash); border-radius: 8px; padding: 10px 12px; margin: 6px 0; }
.gauges { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 4px 0 6px; }
.gauge { padding: 10px 0 0; border-top: 2px solid var(--line); }
.gauge b { font-size: 19px; font-weight: 600; display: block; }
.gauge span { font-size: 11.5px; color: var(--ink-3); }
.bar { height: 6px; border-radius: 3px; background: var(--wash); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--ink-2); border-radius: 3px; }
.tl { position: relative; padding-left: 18px; }
.tl::before { content: ""; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 1px; background: var(--line); }
.tl .ev { position: relative; margin: 0 0 12px; }
.tl .ev::before { content: ""; position: absolute; left: -17px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--panel); border: 2px solid var(--ink-3); }
.tl .ev.think::before { border-color: var(--park); }
.tl .ev.tool::before { border-color: var(--run); }
.tl .ev.res::before { border-color: var(--done); }
.tl .ev.err::before { border-color: var(--cut); }
.tl .ev.msg::before { border-color: var(--wait); background: var(--wait); }
.tl .meta { font-size: 11.5px; color: var(--ink-3); }
.tl .meta b { color: var(--ink-2); font-weight: 600; }
details.fold summary { cursor: pointer; list-style: none; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold[open] summary .more { display: none; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--code); font-size: 11.5px; background: var(--wash); border-radius: 6px; padding: 7px 9px; margin-top: 4px; max-height: 260px; overflow: auto; color: var(--ink-2); }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 13px; }
.crumbs button, .linkbtn { border: 0; background: none; padding: 1px 2px; color: var(--run); cursor: pointer; text-align: left; }
.crumbs .sep { color: var(--ink-3); }
.mlist { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.mrow { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel); cursor: pointer; }
.mrow:hover { background: var(--wash); }
.mrow .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .a { grid-column: 2 / 4; font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -4px; }
.btn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 7px; padding: 5px 11px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.focus { border-color: var(--focus); background: var(--focus-soft); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- tables, lists ---------- */
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 7px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; cursor: default; }
th.sort { cursor: pointer; } th.sort:hover { color: var(--ink); }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--wash); }
td.r, th.r { text-align: right; }
.hbar { display: grid; grid-template-columns: minmax(140px, 260px) 1fr 110px; gap: 12px; align-items: center; padding: 6px 0; font-size: 13px; cursor: pointer; }
.hbar:hover .lbl { color: var(--ink); }
.hbar .lbl { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { position: relative; height: 14px; background: var(--wash); border-radius: 3px; }
.hbar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--ink-2); }
.hbar .cap { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.hbar .v { text-align: right; }
.split { display: flex; height: 26px; border-radius: 4px; overflow: hidden; margin: 8px 0 10px; }
.split div { height: 100%; }
.keys { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.keys span { display: inline-flex; align-items: center; gap: 7px; }
.sq { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.chart text { fill: var(--ink-3); font-size: 11px; font-family: var(--sans); }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 30px 40px; }

/* families */
.fam { display: grid; grid-template-columns: 96px 1fr auto; gap: 18px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.fam:hover .ft { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.fam .ft { font-weight: 600; font-size: 15px; }
.fam .fs { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; margin-top: 4px; }
.fam.on { background: linear-gradient(90deg, var(--focus-soft), transparent 70%); }

/* findings */
.find { display: grid; grid-template-columns: 110px 1fr 120px; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; align-items: start; }
.find:hover .claim { color: var(--ink); }
.find .claim { color: var(--ink-2); }
.steps { display: flex; gap: 4px; margin-top: 6px; }
.steps i { width: 18px; height: 5px; border-radius: 3px; background: var(--c); }
.lvl { font-size: 11px; letter-spacing: .03em; text-transform: uppercase; color: var(--ink-3); }

/* boards */
.boards { display: grid; grid-template-columns: 230px 1fr; gap: 28px; }
.blist button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; cursor: pointer; color: var(--ink-2); }
.blist button.on { background: var(--wash); color: var(--ink); font-weight: 600; }
.blist button .n { float: right; color: var(--ink-3); font-weight: 400; }
.cps { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.cp { border-top: 2px solid var(--c, var(--line-2)); padding-top: 8px; }
.cp .who { font-weight: 600; font-size: 13px; }
.post { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--wash); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--ink-2); }
.post .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); }
.post.peer_review .kind { color: var(--done); }

/* epochs */
.etrack { display: flex; height: 54px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); margin: 6px 0 24px; }
.etrack div { display: flex; flex-direction: column; justify-content: center; padding: 0 12px; border-right: 1px solid var(--line); background: var(--panel); min-width: 90px; cursor: pointer; }
.etrack div.cur { background: var(--focus-soft); }
.etrack b { font-size: 13px; } .etrack span { font-size: 11.5px; color: var(--ink-3); }
.epoch { padding: 18px 0 22px; border-bottom: 1px solid var(--line); }

/* inbox */
.q { padding: 18px 20px; border: 1px solid var(--wait); background: color-mix(in oklch, var(--wait) 7%, var(--panel)); border-radius: 10px; margin-bottom: 14px; }
.q h4 { margin: 0 0 6px; font-size: 16px; }
.q textarea { width: 100%; min-height: 72px; margin-top: 10px; border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 10px; font: inherit; background: var(--panel); color: var(--ink); resize: vertical; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.report-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.report-row:hover b { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.md { max-width: 78ch; font-size: 15px; line-height: 1.65; }
.md h1 { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.15; margin: 0 0 14px; }
.md h2 { font-family: var(--serif); font-weight: 400; font-size: 25px; margin: 30px 0 8px; }
.md h3 { margin-top: 24px; }
.md table { font-size: 12.5px; margin: 10px 0; display: block; overflow-x: auto; }
.md td { border: 1px solid var(--line); }
.md code { font-family: var(--code); font-size: 12.5px; background: var(--wash); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--wash); padding: 10px 12px; border-radius: 8px; overflow: auto; font-size: 12.5px; }

/* evals */
.matrix td.cell { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; border-left: 1px solid var(--panel); }
.matrix th.col { text-align: center; font-size: 11px; }
.ecard { display: grid; grid-template-columns: 1fr 140px; gap: 18px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.ecard .big { font-size: 34px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.issues { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
.issues li.fail { color: var(--cut); }
.issues li.info { color: var(--ink-3); }
.issues li.warn { color: color-mix(in oklch, var(--wait) 70%, var(--ink)); }
.wbars { display: grid; gap: 4px; margin-top: 10px; }
.wbar { display: grid; grid-template-columns: minmax(120px, 220px) 1fr 50px; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.wbar .track { height: 8px; background: var(--wash); border-radius: 4px; overflow: hidden; }
.wbar .track i { display: block; height: 100%; background: var(--done); }
/* feed */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.filters button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.filters button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filters input { border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; background: var(--panel); color: var(--ink); min-width: 220px; }
.frow { display: grid; grid-template-columns: 72px 130px minmax(120px, 200px) 1fr; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.frow .ty { color: var(--ink-2); font-weight: 600; }

@media (max-width: 980px) {
	.app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
	.rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
	.rail .sep, .rail .legend { display: none; }
	.drawer.open { position: fixed; inset: 60px 0 0 auto; width: 100vw; z-index: 10; }
	.drawer .inner { width: 100vw; }
	.strip .metric:nth-child(n+3) { display: none; }
	.boards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="top">
	<div class="brand">one<i>_</i>piece</div>
	<div class="runpick"><label for="run">Run</label><select id="run"></select></div>
	<div class="strip" id="strip"></div>
</header>
<div class="app">
	<nav class="rail" id="rail"></nav>
	<section class="stage" id="stage"></section>
	<aside class="drawer" id="drawer"><div class="inner" id="dinner"></div></aside>
</div>
<div class="tip" id="tip"></div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (n) => Math.round(n ?? 0).toLocaleString();
const kfmt = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(n >= 1e7 ? 0 : 1)}M` : n >= 1e3 ? `${(n / 1e3).toFixed(n >= 1e4 ? 0 : 1)}k` : `${Math.round(n ?? 0)}`);
const ago = (ts) => { const s = Math.max(0, Math.round((Date.now() - ts) / 1000)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : new Date(ts).toLocaleDateString(); };
const dur = (ms) => { const s = Math.round(ms / 1000); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`; };
const ROLE_NAME = { root: "Root", internal: "Explorer", leaf: "Worker", claims_reviewer: "Claims reviewer", hidden_reviewer: "Hidden reviewer", root_reviewer: "Root reviewer" };
const TREE = new Set(["root", "internal", "leaf"]);
const LIVE = new Set(["running", "parked", "pending"]);
const statusChip = (s) => `<span class="chip st s-${esc(s)}"><span class="dot"></span>${esc(String(s).replace(/_/g, " "))}</span>`;

const S = { state: null, runId: null, view: "swarm", reviewers: "all", sel: null, selFinding: null, family: null, epoch: null, drawerTab: "overview", feed: [], feedFilter: "all", feedQuery: "", sort: { key: "tokens", dir: -1 }, boardFam: null, reader: null, zoom: { k: 1, x: 0, y: 0 }, fitted: false, source: null };

// ---------- data ----------
async function api(path, init) { const r = await fetch(path, init); if (!r.ok) throw new Error((await r.text()) || r.statusText); return r.json(); }
async function loadRuns() {
	const runs = await api("/api/runs");
	const sel = $("#run");
	sel.innerHTML = runs.map((r) => `<option value="${esc(r.id)}">${esc(r.goal.title)} — ${esc(r.status)}, ${new Date(r.createdAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</option>`).join("") || "<option>No runs yet</option>";
	if (!S.runId && runs[0]) S.runId = runs[0].id;
	if (S.runId) sel.value = S.runId;
	sel.onchange = () => { S.runId = sel.value; S.sel = null; S.family = null; S.epoch = null; S.feed = []; S.fitted = false; closeDrawer(); connect(); refresh(true); };
}
function connect() {
	S.source?.close();
	if (!S.runId) return;
	S.source = new EventSource(`/api/runs/${encodeURIComponent(S.runId)}/stream`);
	S.source.onmessage = (m) => {
		const { events } = JSON.parse(m.data);
		S.feed.push(...events); if (S.feed.length > 3000) S.feed = S.feed.slice(-3000);
		if (S.view === "feed") renderView();
		if (S.sel && S.drawerTab === "activity" && events.some((e) => e.nodeId === S.sel)) renderDrawer();
	};
}
async function refresh(force) {
	if (!S.runId) { renderAll(); return; }
	const st = await api(`/api/runs/${encodeURIComponent(S.runId)}/state`);
	// Re-render only when something happened, so the page never flickers under the pointer.
	if (!force && S.state && st.lastSeq === S.state.lastSeq && st.run?.id === S.state.run?.id) return;
	st.byId = Object.fromEntries(st.nodes.map((n) => [n.id, n]));
	st.tree = st.nodes.filter((n) => TREE.has(n.role));
	// own = the agent's own model calls; over = what background reviewers spent on it;
	// sub = its whole branch (own + oversight of itself and every descendant).
	st.own = {}; st.over = {}; st.sub = {};
	for (const n of st.nodes) { st.own[n.id] = n.spent?.tokens ?? 0; st.over[n.id] = n.oversight?.tokens ?? 0; }
	const subOf = (id) => { if (st.sub[id] !== undefined) return st.sub[id]; const n = st.byId[id]; if (!n) return 0; return (st.sub[id] = st.own[id] + st.over[id] + (n.children || []).filter((c) => TREE.has(st.byId[c]?.role)).reduce((a, c) => a + subOf(c), 0)); };
	for (const n of st.nodes) subOf(n.id);
	st.reviewersOf = {};
	for (const n of st.nodes) if (n.targetNodeId && !TREE.has(n.role)) (st.reviewersOf[n.targetNodeId] ??= []).push(n);
	S.state = st;
	if (!S.epoch) S.epoch = st.run?.epoch ?? 1;
	renderAll();
}

// ---------- helpers on state ----------
const nodeOf = (id) => S.state?.byId[id];
const titleOf = (id) => nodeOf(id)?.goal.title ?? id;
function rootOfEpoch(epoch) { const e = S.state.epochs.find((x) => x.number === epoch); return e ? nodeOf(e.rootNodeId) : S.state.tree.find((n) => n.role === "root"); }
function families() {
	return S.state.tree.filter((n) => n.children?.some((c) => TREE.has(nodeOf(c)?.role))).map((head) => {
		const members = head.children.map(nodeOf).filter((m) => m && TREE.has(m.role));
		const ids = new Set(members.map((m) => m.id));
		return {
			head, members,
			tokens: members.reduce((a, m) => a + S.state.sub[m.id], 0), // children's branches; the parent's own spend is separate
			running: members.filter((m) => m.status === "running").length,
			live: members.filter((m) => LIVE.has(m.status)).length,
			accepted: S.state.findings.filter((f) => f.status === "accepted" && [...ids].some((i) => i === f.nodeId || isDescendant(f.nodeId, i))).length,
			posts: S.state.posts.filter((p) => p.familyId === head.id).length,
			recs: S.state.recommendations.filter((r) => r.status === "open" && r.deciderNodeId === head.id).length,
		};
	});
}
function isDescendant(id, ancestorId) { let n = nodeOf(id); while (n?.parentId) { if (n.parentId === ancestorId) return true; n = nodeOf(n.parentId); } return false; }
function lineage(id) { const out = []; let n = nodeOf(id); while (n?.parentId) { n = nodeOf(n.parentId); if (n) out.unshift(n); } return out; }

// ---------- chrome ----------
function renderStrip() {
	const st = S.state, r = st?.run;
	if (!r) { $("#strip").innerHTML = ""; return; }
	const total = st.nodes.reduce((a, n) => a + (n.spent?.tokens ?? 0), 0);
	const usd = st.nodes.reduce((a, n) => a + (n.spent?.usd ?? 0), 0);
	const frac = r.budget.tokens ? total / r.budget.tokens : 0;
	const running = st.nodes.filter((n) => n.status === "running").length;
	const parked = st.nodes.filter((n) => n.status === "parked").length;
	const acc = st.findings.filter((f) => f.status === "accepted").length;
	const waiting = st.questions.filter((q) => q.holder === "user" && q.status !== "answered").length;
	$("#strip").innerHTML = `
		<div class="metric"><span>Status</span>${statusChip(r.status)}</div>
		<div class="metric"><b class="num">${fmt(total)}</b><span>tokens${r.budget.tokens ? ` of ${kfmt(r.budget.tokens)}` : ""}</span>${r.budget.tokens ? `<div class="meter ${frac > 0.8 ? "warn" : ""}"><i style="width:${Math.min(100, frac * 100).toFixed(1)}%"></i></div>` : ""}</div>
		<div class="metric"><b class="num">$${usd.toFixed(2)}</b><span>est. cost${r.budget.usd ? ` of $${r.budget.usd}` : ""}</span></div>
		<div class="metric"><b class="num">${running}<span class="dim" style="font-size:13px"> + ${parked} waiting</span></b><span>agents working</span></div>
		<div class="metric"><b class="num">${acc}</b><span>accepted findings</span></div>
		<div class="metric"><b class="num">${r.epoch}</b><span>epoch</span></div>
		${waiting ? `<button class="ask-btn" onclick="go('inbox')">${waiting} question${waiting > 1 ? "s" : ""} for you</button>` : ""}`;
}
const VIEWS = [["swarm", "Swarm"], ["families", "Families"], ["findings", "Findings"], ["boards", "Boards"], ["tokens", "Tokens"], ["epochs", "Epochs"], ["inbox", "Inbox"], ["feed", "Live feed"], ["evals", "Evals"]];
function renderRail() {
	const st = S.state;
	const count = { families: st ? families().length : 0, findings: st?.findings.length ?? 0, boards: st?.posts.length ?? 0, epochs: st?.epochs.length ?? 0 };
	const waiting = st ? st.questions.filter((q) => q.holder === "user" && q.status !== "answered").length : 0;
	$("#rail").innerHTML = VIEWS.map(([k, l]) => `<button class="${S.view === k ? "on" : ""}" onclick="go('${k}')">${l}${k === "inbox" && waiting ? `<span class="n hot">${waiting}</span>` : count[k] ? `<span class="n num">${count[k]}</span>` : ""}</button>`).join("") +
		`<div class="sep"></div><div class="legend">
			<div><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="var(--panel)" stroke="var(--ink-2)" stroke-width="2.4"/><circle cx="7" cy="7" r="2" fill="var(--ink-2)"/></svg>Root</div>
			<div><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="var(--wash)" stroke="var(--ink-2)" stroke-width="2.2"/></svg>Explorer (splits work)</div>
			<div><svg width="14" height="14"><circle cx="7" cy="7" r="5.5" fill="var(--ink-2)"/></svg>Worker (does work)</div>
			<div><svg width="16" height="14"><rect x="2" y="1" width="12" height="12" rx="3" fill="var(--wash)" stroke="var(--ink-2)" stroke-width="1.4"/><text x="8" y="10" font-size="8" font-weight="700" text-anchor="middle" fill="var(--ink)">H</text></svg>Hidden reviewer</div>
			<div><svg width="16" height="14"><rect x="2" y="1" width="12" height="12" rx="3" fill="var(--wash)" stroke="var(--ink-2)" stroke-width="1.4"/><text x="8" y="10" font-size="8" font-weight="700" text-anchor="middle" fill="var(--ink)">C</text></svg>Claims reviewer</div>
			<div><svg width="16" height="14"><rect x="2" y="1" width="12" height="12" rx="3" fill="var(--wash)" stroke="var(--ink-2)" stroke-width="1.4"/><text x="8" y="10" font-size="8" font-weight="700" text-anchor="middle" fill="var(--ink)">R</text></svg>Root reviewer (epochs)</div>
			<div style="margin-top:4px"><span class="dot st s-running"></span>running</div>
			<div><span class="dot st s-parked"></span>waiting (costs nothing)</div>
			<div><span class="dot st s-done"></span>done</div>
			<div><span class="dot st s-cut"></span>cut or failed</div>
			<div><span class="dot st s-archived"></span>merged or archived</div>
			<div style="margin-top:4px">Size = the agent's own tokens</div>
		</div>`;
}
function go(view) { S.view = view; S.reader = null; renderAll(); }
function renderAll() { renderStrip(); renderRail(); renderView(); renderDrawer(); }

// ---------- views ----------
function renderView() {
	const stage = $("#stage");
	if (S.view === "evals") return renderEvals();
	if (!S.state?.run) { stage.innerHTML = `<div class="page"><h1 class="view">No runs yet</h1><p class="lede">Start one from a project folder: <span class="code">one-piece run "your goal" --dashboard</span>. This page fills in as the swarm works.</p></div>`; return; }
	if (S.reader) return renderReader();
	if (S.view === "swarm") return renderSwarm();
	if (S.view === "evals") return renderEvals();
	const page = { families: viewFamilies, findings: viewFindings, boards: viewBoards, tokens: viewTokens, epochs: viewEpochs, inbox: viewInbox, feed: viewFeed }[S.view]();
	const keepScroll = stage.scrollTop;
	stage.innerHTML = `<div class="page">${page}</div>`;
	stage.scrollTop = keepScroll;
	bindPage(stage);
}

// ---------- swarm graph ----------
const RING = 150;
function layout(root) {
	const kids = (n) => (n.children || []).map(nodeOf).filter((c) => c && TREE.has(c.role));
	const leaves = {};
	const count = (n) => (leaves[n.id] = kids(n).length ? kids(n).reduce((a, c) => a + count(c), 0) : 1);
	count(root);
	const pos = {};
	const place = (n, a0, a1, depth) => {
		const a = (a0 + a1) / 2;
		pos[n.id] = { a, r: depth * RING, depth, x: Math.sin(a) * depth * RING, y: -Math.cos(a) * depth * RING };
		let cur = a0;
		for (const c of kids(n)) { const span = ((a1 - a0) * leaves[c.id]) / leaves[n.id]; place(c, cur, cur + span, depth + 1); cur += span; }
	};
	const top = kids(root).length;
	place(root, top === 1 ? -0.6 : 0, top === 1 ? 0.6 : Math.PI * 2, 0);
	return pos;
}
function polar(a, r) { return [Math.sin(a) * r, -Math.cos(a) * r]; }
function linkPath(p, c) {
	if (p.depth === 0) { const m = polar(c.a, c.r * 0.55); return `M0 0 Q${m[0].toFixed(1)} ${m[1].toFixed(1)} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`; }
	const c1 = polar(p.a, p.r + RING * 0.5), c2 = polar(c.a, c.r - RING * 0.5);
	return `M${p.x.toFixed(1)} ${p.y.toFixed(1)} C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`;
}
const REV_LETTER = { hidden_reviewer: "H", claims_reviewer: "C", root_reviewer: "R" };
function renderSwarm() {
	const st = S.state, stage = $("#stage");
	const root = rootOfEpoch(S.epoch) ?? st.tree.find((n) => n.role === "root");
	if (!root) { stage.innerHTML = `<div class="page"><p class="empty">The root agent has not started yet.</p></div>`; return; }
	const pos = layout(root);
	const ids = Object.keys(pos);
	const maxOwn = Math.max(1, ...ids.filter((i) => i !== root.id).map((i) => st.own[i]));
	const famIds = S.family ? new Set([S.family, ...(nodeOf(S.family)?.children || [])]) : null;
	const depthMax = Math.max(...ids.map((i) => pos[i].depth));
	let g = "";
	for (let d = 1; d <= depthMax; d++) g += `<circle class="ring" r="${d * RING}"/>`;
	if (famIds && pos[S.family]) {
		const head = pos[S.family];
		const ch = (nodeOf(S.family).children || []).filter((c) => pos[c]).map((c) => pos[c]);
		if (ch.length) {
			const r = ch[0].r, a0 = Math.min(...ch.map((c) => c.a)) - 0.12, a1 = Math.max(...ch.map((c) => c.a)) + 0.12;
			const [x0, y0] = polar(a0, r + 30), [x1, y1] = polar(a1, r + 30), [x2, y2] = polar(a1, Math.max(0, head.r - 24)), [x3, y3] = polar(a0, Math.max(0, head.r - 24));
			const big = a1 - a0 > Math.PI ? 1 : 0;
			g += `<path class="famband" d="M${x3} ${y3} L${x0} ${y0} A${r + 30} ${r + 30} 0 ${big} 1 ${x1} ${y1} L${x2} ${y2} ${head.r > 24 ? `A${head.r - 24} ${head.r - 24} 0 ${big} 0 ${x3} ${y3}` : ""} Z"/>`;
		}
	}
	for (const id of ids) {
		const n = nodeOf(id);
		for (const c of n.children || []) {
			if (!pos[c]) continue;
			const hi = famIds && famIds.has(c) && id === S.family;
			const dim = famIds && !(famIds.has(c) && famIds.has(id));
			g += `<path class="link ${hi ? "hi" : ""} ${dim ? "faded" : ""}" d="${linkPath(pos[id], pos[c])}"/>`;
		}
	}
	// Background reviewers orbit the agent they review, on the outer side.
	let rv = "";
	const shownReviewers = [];
	S.revPos = [];
	if (S.reviewers !== "off") {
		for (const id of ids) {
			const all = (st.reviewersOf[id] || []).filter((r) => S.reviewers === "all" || LIVE.has(r.status));
			if (!all.length) continue;
			const p = pos[id];
			const list = all.sort((a, b) => a.createdAt - b.createdAt).slice(-12);
			const own = nodeOf(id), rr = own.role === "root" ? 17 : 6 + 13 * Math.sqrt(st.own[id] / maxOwn);
			const perRow = 6, gap = 18;
			list.forEach((r, i) => {
				const row = Math.floor(i / perRow), col = i % perRow, inRow = Math.min(perRow, list.length - row * perRow);
				const dx = (col - (inRow - 1) / 2) * gap;
				const dy = (p.depth === 0 ? -1 : 1) * (rr + 16 + row * gap);
				const x = p.x + dx, y = p.y + dy;
				const old = !LIVE.has(r.status);
				const dim = famIds && !famIds.has(id);
				shownReviewers.push(r.id);
				S.revPos.push([x, y]);
				rv += `<path class="rlink ${old ? "old" : ""} ${dim ? "faded" : ""}" d="M${p.x.toFixed(1)} ${(p.y + Math.sign(dy) * rr).toFixed(1)} L${x.toFixed(1)} ${(y - Math.sign(dy) * 7).toFixed(1)}"/>`;
				rv += `<g class="rnode s-${r.status} ${old ? "old" : ""} ${S.sel === r.id ? "sel" : ""} ${dim ? "faded" : ""}" data-id="${esc(r.id)}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})"><rect class="rhalo" x="-11" y="-11" width="22" height="22" rx="6"/><rect class="rbody" x="-7.5" y="-7.5" width="15" height="15" rx="4"/><text y="3">${REV_LETTER[r.role] ?? "?"}</text></g>`;
			});
		}
	}
	g += rv.replace(/<g class="rnode[\s\S]*?<\/g>/g, "") ; // links first, under agents
	const order = ids.sort((a, b) => pos[b].depth - pos[a].depth);
	for (const id of order) {
		const n = nodeOf(id), p = pos[id];
		const r = n.role === "root" ? 17 : 6 + 13 * Math.sqrt(st.own[id] / maxOwn);
		const dim = famIds && !famIds.has(id);
		const side = p.depth === 0 ? "mid" : Math.sin(p.a) >= 0 ? "start" : "end";
		const lx = p.depth === 0 ? 0 : (r + 10) * (side === "start" ? 1 : -1);
		const ly = p.depth === 0 ? r + 18 : 4;
		const title = n.goal.title.length > 30 ? `${n.goal.title.slice(0, 29)}…` : n.goal.title;
		const hasKids = (n.children || []).some((c) => pos[c]);
		const sub = `${kfmt(st.own[id])} own${hasKids ? ` · ${kfmt(st.sub[id])} branch` : ""}${n.grade !== undefined ? ` · grade ${n.grade.toFixed(2)}` : ""}`;
		g += `<g class="gnode ${n.role} s-${n.status} ${S.sel === id ? "sel" : ""} ${dim ? "faded" : ""}" data-id="${esc(id)}" transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})">
			<circle class="halo" r="${(r + 6).toFixed(1)}"/>
			${n.status === "running" ? `<circle class="orbit" r="${(r + 4).toFixed(1)}"/>` : ""}
			<circle class="body" r="${r.toFixed(1)}"/>${n.role === "root" ? `<circle class="core" r="5"/>` : ""}
			<text class="glabel ${p.depth <= 1 || S.sel === id ? "strong" : ""}" x="${lx}" y="${ly}" text-anchor="${side === "mid" ? "middle" : side}">${esc(title)}</text>
			<text class="gsub" x="${lx}" y="${ly + 14}" text-anchor="${side === "mid" ? "middle" : side}">${sub}</text>
		</g>`;
	}
	g += (rv.match(/<g class="rnode[\s\S]*?<\/g>/g) || []).join("");
	let svg = $("#gsvg");
	if (!svg) {
		stage.innerHTML = `<div class="graph" id="graph"><div class="gtools" id="gtools"></div><svg id="gsvg"><g id="gview"></g></svg><div class="gfoot" id="gfoot"></div></div>`;
		svg = $("#gsvg");
		attachPanZoom();
	}
	const famTag = S.family ? `<div class="famtag">Family of <b>${esc(titleOf(S.family))}</b><button title="Clear" onclick="selectFamily(null)">×</button></div>` : "";

			return `<div class="fam ${S.family === f.head.id ? "on" : ""}" data-family="${esc(f.head.id)}"><svg width="96" height="80" viewBox="0 0 96 80">${dots}<circle cx="48" cy="40" r="7" fill="var(--panel)" stroke="var(--ink-2)" stroke-width="2"/></svg>
				<div><div class="ft">${esc(f.head.goal.title)}</div><div class="fs"><span>${esc(ROLE_NAME[f.head.role])} with ${f.members.length} children</span><span>${f.running} running · ${f.live} live</span><span class="num">${kfmt(f.tokens)} tokens</span><span>${f.accepted} accepted findings</span><span>${f.posts} board posts</span>${f.recs ? `<span style="color:var(--wait);font-weight:600">${f.recs} recommendation${f.recs > 1 ? "s" : ""} to decide</span>` : ""}</div></div>
				<div class="row"><button class="btn" data-family-show="${esc(f.head.id)}">Show in swarm</button></div></div>`;

function viewFindings() {
	const order = { accepted: 0, needs_work: 1, pending_review: 2, unreviewed: 3, rejected: 4 };
	const fs = [...S.state.findings].sort((a, b) => order[a.status] - order[b.status] || b.updatedAt - a.updatedAt);
	const count = (s) => fs.filter((f) => f.status === s).length;
	if (!fs.length) return `<h1 class="view">Findings</h1><p class="empty">No findings yet. When a worker reports a result, a claims reviewer on another model checks it; only accepted findings travel up the tree.</p>`;
	return `<h1 class="view">Findings</h1><p class="lede">${count("accepted")} accepted, ${count("needs_work")} sent back for more work, ${count("pending_review")} under review, ${count("rejected")} rejected${count("unreviewed") ? `, ${count("unreviewed")} closed unreviewed when the run ended` : ""}. Bars show each review round.</p>
		${fs.map((f) => `<div class="find" data-finding="${esc(f.id)}"><div>${statusChip(f.status)}<div class="steps">${f.rounds.map((r) => `<i class="s-${r.verdict}" title="round ${r.round}: ${esc(r.verdict)}"></i>`).join("")}</div></div><div><div class="lvl">${esc(f.level.replace(/_/g, " "))}${f.confidence !== undefined ? ` · confidence ${f.confidence.toFixed(2)}` : ""}</div><div class="claim">${esc(f.claim)}</div></div><div class="dim" style="font-size:12.5px;text-align:right">${esc(titleOf(f.nodeId))}<br>${ago(f.updatedAt)}</div></div>`).join("")}`;
}
function boardFeed(posts, limit) {
	const latest = new Map();
	for (const p of posts) if (p.kind === "checkpoint") latest.set(p.authorNode, p);
	const others = posts.filter((p) => p.kind !== "checkpoint").slice(-limit).reverse();
	const initials = (id) => esc(titleOf(id).split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase());
	return `${latest.size ? `<div class="cps" style="margin-bottom:14px">${[...latest.values()].map((p) => `<div class="cp s-${nodeOf(p.authorNode)?.status ?? "done"}" style="--c:var(--c)"><div class="who"><button class="linkbtn" data-node="${esc(p.authorNode)}" style="color:var(--ink);font-weight:600">${esc(titleOf(p.authorNode))}</button></div><div class="dim" style="font-size:11.5px">checkpoint · ${ago(p.createdAt)}</div><div class="prose soft" style="font-size:13px;margin-top:4px">${esc(p.body)}</div></div>`).join("")}</div>` : ""}
		${others.map((p) => `<div class="post ${esc(p.kind)}"><div class="avatar">${initials(p.authorNode)}</div><div><div class="kind">${esc(p.kind.replace(/_/g, " "))} · <span class="dim" style="text-transform:none">${ago(p.createdAt)}</span></div><div><b>${esc(p.title)}</b> <span class="dim">by</span> <button class="linkbtn" data-node="${esc(p.authorNode)}">${esc(titleOf(p.authorNode))}</button></div><div class="prose soft">${esc(p.body)}</div></div></div>`).join("")}`;
}
function viewBoards() {

		<div class="boards"><div class="blist">${ids.map((id) => `<button class="${id === S.boardFam ? "on" : ""}" data-board="${esc(id)}">${esc(titleOf(id))}<span class="n num">${fams[id].length}</span></button>`).join("")}</div>
		<div><h3 style="margin-top:0">Family of ${esc(titleOf(S.boardFam))}</h3>${boardFeed(fams[S.boardFam], 60)}</div></div>`;
}
function hbars(items, max) {
	return items.map((it) => `<div class="hbar" ${it.node ? `data-node="${esc(it.node)}"` : ""}><span class="lbl" title="${esc(it.label)}">${esc(it.label)}</span><span class="track"><span class="fill" style="width:${((it.value / max) * 100).toFixed(1)}%;${it.color ? `background:${it.color}` : ""}"></span>${it.cap ? `<span class="cap" style="left:${Math.min(100, (it.cap / max) * 100).toFixed(1)}%" title="budget ${fmt(it.cap)}"></span>` : ""}</span><span class="v num">${kfmt(it.value)}${it.cap ? ` <span class="dim">/ ${kfmt(it.cap)}</span>` : ""}</span></div>`).join("");
}
function lineChart(points, opts) {
	const W = 900, H = 230, L = 52, R = 16, T = 14, B = 26;
	if (points.length < 2) return `<p class="empty">The curve appears once the swarm has made a few model calls.</p>`;
	const x0 = points[0][0], x1 = Math.max(points.at(-1)[0], x0 + 1000);
	const ymax = Math.max(opts.cap ?? 0, ...points.map((p) => p[1])) * 1.06 || 1;
	const X = (t) => L + ((t - x0) / (x1 - x0)) * (W - L - R), Y = (v) => T + (1 - v / ymax) * (H - T - B);
	const d = points.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(" ");
	const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => ymax * f);
	let g = ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`).join("");
	if (opts.cap) g += `<line x1="${L}" x2="${W - R}" y1="${Y(opts.cap)}" y2="${Y(opts.cap)}" stroke="var(--ink)" stroke-dasharray="5 4"/><text x="${W - R}" y="${Y(opts.cap) - 6}" text-anchor="end" style="fill:var(--ink)">budget ${kfmt(opts.cap)}</text>`;
	for (const m of opts.marks ?? []) if (m.t >= x0) g += `<line x1="${X(m.t)}" x2="${X(m.t)}" y1="${T}" y2="${H - B}" stroke="var(--focus)" stroke-dasharray="3 3"/><text x="${X(m.t) + 4}" y="${T + 10}" style="fill:var(--ink-2)">${esc(m.label)}</text>`;
	g += `<path d="${d} L${X(points.at(-1)[0])} ${Y(0)} L${X(points[0][0])} ${Y(0)} Z" fill="color-mix(in oklch, var(--ink) 6%, transparent)"/><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
	for (const a of opts.dots ?? []) if (a >= x0) g += `<circle cx="${X(a)}" cy="${H - B}" r="4" fill="var(--done)"/>`;
	g += `<text x="${L}" y="${H - 6}">0</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${dur(x1 - x0)}</text>`;
	return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.label)}">${g}</svg>`;
}
function stepChart(series, opts) {
	const W = 900, H = 200, L = 40, R = 16, T = 14, B = 26;
	const all = series.flatMap((x) => x.points);
	if (all.length < 2) return `<p class="empty">Appears once agents start launching.</p>`;
	const x0 = Math.min(...all.map((p) => p[0])), x1 = Math.max(x0 + 1000, ...all.map((p) => p[0]));
	const ymax = Math.max(1, ...all.map((p) => p[1])) * 1.1;
	const X = (t) => L + ((t - x0) / (x1 - x0)) * (W - L - R), Y = (v) => T + (1 - v / ymax) * (H - T - B);
	let g = [0, 0.5, 1].map((f) => `<line x1="${L}" x2="${W - R}" y1="${Y(ymax * f)}" y2="${Y(ymax * f)}" stroke="var(--line)"/><text x="${L - 8}" y="${Y(ymax * f) + 4}" text-anchor="end">${Math.round(ymax * f)}</text>`).join("");
	for (const sr of series) {
		if (!sr.points.length) continue;
		let d = `M${X(sr.points[0][0])} ${Y(0)}`;
		let prev = 0;
		for (const [t, v] of sr.points) { d += ` L${X(t).toFixed(1)} ${Y(prev).toFixed(1)} L${X(t).toFixed(1)} ${Y(v).toFixed(1)}`; prev = v; }
		d += ` L${X(x1)} ${Y(prev)}`;
		g += `<path d="${d}" fill="none" stroke="${sr.color}" stroke-width="2"/>`;
	}
	g += `<text x="${L}" y="${H - 6}">0</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${dur(x1 - x0)}</text>`;
	return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.label)}">${g}</svg>`;
}
function viewTokens() {
	const st = S.state, run = st.run;
	const total = st.nodes.reduce((a, n) => a + st.own[n.id], 0);
	const usd = st.nodes.reduce((a, n) => a + (n.spent?.usd ?? 0), 0);
	const GROUPS = { Workers: ["leaf"], Managers: ["root", "internal"], "Background reviewers": ["claims_reviewer", "hidden_reviewer", "root_reviewer"] };
	const COLORS = { Workers: "var(--run)", Managers: "var(--ink-2)", "Background reviewers": "var(--wait)" };
	const groupOf = (role) => Object.keys(GROUPS).find((g) => GROUPS[g].includes(role));
	const byGroup = Object.fromEntries(Object.keys(GROUPS).map((g) => [g, st.nodes.filter((n) => groupOf(n.role) === g).reduce((a, n) => a + st.own[n.id], 0)]));
	const gsum = Math.max(1, total);
	// launches over time, per group
	const launches = Object.keys(GROUPS).map((g) => { const ts = st.nodes.filter((n) => groupOf(n.role) === g).map((n) => n.createdAt).sort((a, b) => a - b); return { name: g, color: COLORS[g], points: ts.map((t, i) => [t, i + 1]) }; });
	const marks = st.epochs.filter((e) => e.number > 1).map((e) => ({ t: e.startedAt, label: `epoch ${e.number}` }));
	const dots = st.series.accepted.map((p) => p[0]);
	// reviewers
	const revs = st.nodes.filter((n) => !TREE.has(n.role));
	const revTypes = ["hidden_reviewer", "claims_reviewer", "root_reviewer"].map((role) => { const list = revs.filter((r) => r.role === role); const tok = list.reduce((a, r) => a + st.own[r.id], 0); return { role, count: list.length, live: list.filter((r) => LIVE.has(r.status)).length, tok, avg: list.length ? tok / list.length : 0 }; });
	const reviewed = st.tree.filter((n) => st.over[n.id] > 0).map((n) => { const rs = st.reviewersOf[n.id] || []; return { n, over: st.over[n.id], own: st.own[n.id], hidden: rs.filter((r) => r.role === "hidden_reviewer").length, claims: rs.filter((r) => r.role === "claims_reviewer").length }; }).sort((a, b) => b.over - a.over);
	const recentRevs = [...revs].sort((a, b) => b.createdAt - a.createdAt).slice(0, 25);
	// top-level branches and families
	const root = rootOfEpoch(st.run.epoch);
	const branches = (root?.children || []).map(nodeOf).filter((n) => n && TREE.has(n.role)).map((n) => ({ label: n.goal.title, value: st.sub[n.id], cap: n.budget?.tokens, node: n.id })).sort((a, b) => b.value - a.value);
	const fams = families().map((f) => ({ f, total: f.members.reduce((a, m) => a + st.sub[m.id], 0) })).sort((a, b) => b.total - a.total);

	const maxF = Math.max(1, ...fams.map((x) => x.total));

	const filter = S.agentFilter ?? "all";
	const key = S.sort.key, dir = S.sort.dir;
	const agents = st.nodes.filter((n) => filter === "all" || groupOf(n.role) === filter).map((n) => ({ n, own: st.own[n.id], over: st.over[n.id], sub: TREE.has(n.role) ? st.sub[n.id] : 0, usd: n.spent?.usd ?? 0, turns: n.turns, created: n.createdAt }))
		.sort((a, b) => (key === "name" ? a.n.goal.title.localeCompare(b.n.goal.title) : (a[key] ?? 0) - (b[key] ?? 0)) * dir).slice(0, 120);
	const th = (k, l, cls = "") => `<th class="sort ${cls}" data-sort="${k}">${l}${key === k ? (dir < 0 ? " ↓" : " ↑") : ""}</th>`;
	const prov = Object.entries(st.providers);
	return `<h1 class="view">Tokens</h1><p class="lede"><b class="num">${fmt(total)}</b> tokens${run.budget.tokens ? ` of a ${fmt(run.budget.tokens)} budget (${((total / run.budget.tokens) * 100).toFixed(1)}%)` : ""}, about <b>$${usd.toFixed(2)}</b> at list prices. Every number on this page is counted once, on the agent that spent it; branch and family totals add those up.</p>
		${lineChart(st.series.tokens, { label: "Tokens over time", cap: run.budget.tokens, marks, dots })}
		<h3>Who spent them</h3>
		<div class="split">${Object.entries(byGroup).map(([g, v]) => `<div style="width:${(v / gsum) * 100}%;background:${COLORS[g]}" title="${g}: ${fmt(v)}"></div>`).join("")}</div>
		<div class="keys">${Object.entries(byGroup).map(([g, v]) => `<span><i class="sq" style="background:${COLORS[g]}"></i>${g} <b class="num">${kfmt(v)}</b> <span class="dim">${((v / gsum) * 100).toFixed(0)}%</span></span>`).join("")}</div>

		<h3>Agent launches over time</h3>

		<div class="keys">${launches.map((l) => `<span><i class="sq" style="background:${l.color}"></i>${l.name} <b class="num">${l.points.length}</b></span>`).join("")}<span class="dim">${st.nodes.filter((n) => LIVE.has(n.status)).length} working or waiting right now</span></div>

		<h3>Background reviewers</h3>

		</div>

		<h3>By provider and model</h3>${prov.length ? `<table><tr><th>Provider</th><th class="r">Calls</th><th class="r">Tokens</th><th class="r">Est. cost</th><th class="r">Avg. wait for quota</th><th class="r">Errors</th><th>Models</th></tr>${prov.map(([p, s]) => `<tr><td>${esc(p)}</td><td class="r num">${fmt(s.calls)}</td><td class="r num">${fmt(s.tokens)}</td><td class="r num">$${s.usd.toFixed(2)}</td><td class="r num">${(s.waitedMs / Math.max(1, s.calls) / 1000).toFixed(1)}s</td><td class="r num">${s.errors}</td><td class="soft">${Object.entries(s.models).map(([m, c]) => `${esc(m)} <span class="dim">×${c}</span>`).join(", ")}</td></tr>`).join("")}</table>` : '<p class="dim">No model calls yet.</p>'}

		<h3>Every agent</h3>
		<div class="filters">${["all", "Workers", "Managers", "Background reviewers"].map((k) => `<button class="${filter === k ? "on" : ""}" data-agentfilter="${k}">${k === "all" ? "All" : k}</button>`).join("")}</div>
		<table><tr>${th("name", "Agent")}<th>Role</th><th>Status</th>${th("own", "Own tokens", "r")}${th("over", "Reviews of it", "r")}${th("sub", "Branch total", "r")}${th("usd", "Est. cost", "r")}${th("turns", "Turns", "r")}${th("created", "Launched", "r")}</tr>
		${agents.map(({ n, own, over, sub, usd, turns }) => `<tr class="click" data-node="${esc(n.id)}"><td>${esc(TREE.has(n.role) ? n.goal.title : `${ROLE_NAME[n.role]} of ${titleOf(n.targetNodeId)}`)}</td><td class="soft">${esc(ROLE_NAME[n.role])}</td><td>${statusChip(n.status)}</td><td class="r num">${fmt(own)}</td><td class="r num">${TREE.has(n.role) ? fmt(over) : ""}</td><td class="r num">${TREE.has(n.role) && n.children?.length ? fmt(sub) : ""}</td><td class="r num">$${usd.toFixed(3)}</td><td class="r num">${turns}</td><td class="r dim">${ago(n.createdAt)}</td></tr>`).join("")}</table>`;
}
function md(text) {
	const lines = esc(text).split("\n"); let out = "", code = false, table = false, list = false;
	const inl = (s) => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
	for (const line of lines) {
		if (line.startsWith("```")) { out += code ? "</pre>" : "<pre>"; code = !code; continue; }
		if (code) { out += `${line}\n`; continue; }
		const tl = line.trim();
		if (/^\|.*\|$/.test(tl)) { if (/^\|[\s:|-]+\|$/.test(tl)) continue; if (!table) { out += "<table>"; table = true; } out += `<tr>${tl.slice(1, -1).split(/(?<!\\)\|/).map((c) => `<td>${inl(c.trim())}</td>`).join("")}</tr>`; continue; }
		if (table) { out += "</table>"; table = false; }
		if (/^\s*[-*] /.test(line)) { if (!list) { out += "<ul>"; list = true; } out += `<li>${inl(line.replace(/^\s*[-*] /, ""))}</li>`; continue; }
		if (list) { out += "</ul>"; list = false; }
		const h = /^(#{1,4}) (.*)/.exec(line);
		if (h) { out += `<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`; continue; }
		if (tl) out += `<p>${inl(line)}</p>`;
	}
	if (table) out += "</table>"; if (list) out += "</ul>"; if (code) out += "</pre>";
	return `<div class="md">${out}</div>`;
}
function viewEpochs() {
	const eps = [...S.state.epochs].sort((a, b) => a.number - b.number);
	const now = Date.now(), t0 = eps[0]?.startedAt ?? now;
	const span = Math.max(1, (S.state.run.status === "running" ? now : (eps.at(-1)?.endedAt ?? S.state.run.updatedAt)) - t0);
	return `<h1 class="view">Epochs</h1><p class="lede">An epoch is one root and its tree. The root reviewer starts a new one when the search saturates (A), the framing turns out wrong (B), or at a scheduled checkpoint (C); the mode decides what carries over.</p>
		<div class="etrack">${eps.map((e) => { const end = e.endedAt ?? (S.state.run.status === "running" ? now : S.state.run.updatedAt); return `<div class="${e.number === S.state.run.epoch ? "cur" : ""}" style="flex:${Math.max(0.12, (end - e.startedAt) / span)}" onclick="pickEpoch(${e.number});go('swarm')"><b>Epoch ${e.number}</b><span>${dur(end - e.startedAt)}${e.trigger ? ` · ${esc(e.trigger.replace(/_/g, " "))}` : ""}</span></div>`; }).join("")}</div>
		${[...eps].reverse().map((e) => `<div class="epoch"><div class="row"><b style="font-size:16px">Epoch ${e.number}</b>${e.trigger ? `<span class="chip">${esc(e.trigger.replace(/_/g, " "))}</span>` : `<span class="chip">first</span>`}${e.mode ? `<span class="chip">mode: ${esc(e.mode)}</span>` : ""}<span class="dim">${new Date(e.startedAt).toLocaleString()}${e.endedAt ? ` → ${new Date(e.endedAt).toLocaleTimeString()}` : " · current"}</span><button class="btn" style="margin-left:auto" onclick="pickEpoch(${e.number});go('swarm')">View its tree</button></div>
			${e.carried.length ? `<div class="soft" style="margin-top:8px">Carried over: ${e.carried.map((id) => `<button class="linkbtn" data-node="${esc(id)}">${esc(titleOf(id))}</button>`).join(", ")}</div>` : ""}
			${e.handoff ? `<h3>State of knowledge handed over</h3><div class="box">${md(e.handoff)}</div>` : ""}</div>`).join("")}`;
}
function viewInbox() {
	const st = S.state;
	const qs = st.questions.filter((q) => q.holder === "user").sort((a, b) => (a.status === "answered") - (b.status === "answered") || b.createdAt - a.createdAt);
	const reports = [...st.reports].sort((a, b) => b.createdAt - a.createdAt);
	const recs = st.recommendations.filter((r) => r.status === "open");
	return `<h1 class="view">Inbox</h1><p class="lede">Questions only you can answer, the swarm's reports, and reviewer recommendations its managers still have to act on.</p>
		<h3 style="margin-top:0">Questions for you</h3>${qs.length ? qs.map((q) => `<div class="q"><div class="row"><span class="chip st s-${q.status === "answered" ? "done" : "needs_work"}">${q.status === "answered" ? "answered" : "waiting for you"}</span><span class="dim">asked by <button class="linkbtn" data-node="${esc(q.fromNode)}">${esc(titleOf(q.fromNode))}</button> · ${ago(q.createdAt)}</span></div>
			<h4 style="margin-top:10px">${esc(q.question)}</h4><div class="prose soft">${esc(q.context)}</div>
			${q.status === "answered" ? `<p>You answered: <b>${esc(q.answer)}</b></p>` : `${q.options.length ? `<div class="opts">${q.options.map((o) => `<button class="btn" data-fill="${esc(q.id)}" data-text="${esc(o)}">${esc(o)}</button>`).join("")}</div>` : ""}<textarea id="ans-${esc(q.id)}" placeholder="Your answer (their default: ${esc(q.default)})"></textarea><div class="row" style="margin-top:8px"><button class="btn primary" data-answer="${esc(q.id)}">Send answer</button><span class="dim">Only the branch that asked is waiting; the rest keeps working.</span></div>`}</div>`).join("") : `<p class="dim">Nothing needs you. Agents ask their parents first; only the root can escalate to you.</p>`}
		<h3>Reports</h3>${reports.length ? reports.map((r) => `<div class="report-row" data-report="${esc(r.id)}"><div><b>${esc(r.title)}</b><div class="dim" style="font-size:12.5px">${esc(r.kind)} report · epoch ${r.epoch} · ${ago(r.createdAt)}</div></div><span class="soft">Read →</span></div>`).join("") : `<p class="dim">The final report appears here when the root finishes.</p>`}
		<h3>Recommendations waiting on a manager</h3>${recs.length ? recs.map(recRow).join("") : `<p class="dim">None open.</p>`}`;
}
async function renderReader() {
	const r = await api(`/api/runs/${encodeURIComponent(S.runId)}/reports/${encodeURIComponent(S.reader)}`);
	$("#stage").innerHTML = `<div class="page"><button class="btn" onclick="S.reader=null;renderView()">← Back to inbox</button><div style="margin-top:26px">${md(r.markdown)}</div></div>`;
}
const FEED_GROUPS = { all: null, agents: ["agent.message", "agent.error", "agent.retry", "node.spawned", "node.status", "node.checkpoint", "node.contract"], tools: ["tool.call", "tool.result", "workspace.command"], findings: ["finding.reported", "finding.verdict"], reviews: ["review.started", "recommendations.updated", "epoch.consulted", "epoch.decision", "epoch.started"], questions: ["question.asked", "question.answered", "question.escalated_to_user", "node.delivered"], jobs: ["job.submitted", "job.started", "job.finished", "job.cached"], money: ["model.call", "budget.transferred", "budget.reclaimed"] };
const scoreColor = (v) => `color-mix(in oklch, var(--done) ${Math.round(12 + v * 60)}%, var(--panel))`;
const healthWord = { ok: "healthy", warn: "warnings", fail: "broke" };
const healthClass = { ok: "done", warn: "needs_work", fail: "failed" };
async function renderEvals() {
	const stage = $("#stage");
	let rounds = [];
	try { rounds = await api("/api/evals"); } catch {}
	if (!rounds.length) {
		stage.innerHTML = `<div class="page"><h1 class="view">Evals</h1><p class="lede">Run <span class="code">one-piece eval --suite smoke</span> to grade the harness on Mac-only tasks: optimization with continuous scores, engineering with hidden tests, and wide coordination. Each round lands here with scores, health checks and a link to its swarm.</p></div>`;
		return;
	}
	if (!S.evalRound || !rounds.some((r) => r.id === S.evalRound)) S.evalRound = rounds[0].id;
	const round = rounds.find((r) => r.id === S.evalRound);
	const when = (id) => {
		const solo = id.endsWith("-solo");
		const iso = id.replace(/-solo$/, "").replace(/T(\d\d)-(\d\d)-(\d\d)-(\d+)Z/, "T$1:$2:$3.$4Z");
		const d = new Date(iso);
		return `${isNaN(d) ? id : d.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}${solo ? " · solo" : ""}`;
	};
	const mean = (r) => r.results.reduce((a, x) => a + x.score, 0) / Math.max(1, r.results.length);
	const ok = (r) => r.results.filter((x) => x.health.status !== "fail").length;
	const taskIds = [...new Set(rounds.flatMap((r) => r.results.map((x) => x.task.id)))].sort();
	const cols = rounds.slice(0, 10).reverse();
	const cell = (x) => x
		? `<td class="cell" style="background:${scoreColor(x.score)}" title="${esc(healthWord[x.health.status])}">${x.score.toFixed(2)}${x.health.status === "fail" ? ' <span style="color:var(--cut)">✕</span>' : x.health.status === "warn" ? ' <span style="color:var(--wait)">!</span>' : ""}</td>`
		: `<td class="cell dim">—</td>`;
	const matrix = `<table class="matrix"><tr><th>Task</th>${cols.map((r) => `<th class="col"><button class="linkbtn" data-round="${esc(r.id)}" style="${r.id === S.evalRound ? "font-weight:700;color:var(--ink)" : ""}">${esc(when(r.id))}</button></th>`).join("")}</tr>
		${taskIds.map((t) => `<tr><td>${esc(t)}</td>${cols.map((r) => cell(r.results.find((y) => y.task.id === t))).join("")}</tr>`).join("")}
		<tr><td><b>Mean</b></td>${cols.map((r) => `<td class="cell"><b>${mean(r).toFixed(2)}</b></td>`).join("")}</tr>
		<tr><td class="dim">Ran without breaking</td>${cols.map((r) => `<td class="cell dim">${ok(r)}/${r.results.length}</td>`).join("")}</tr></table>`;
	const cards = round.results.map((x) => {
		const st = x.stats;
		return `<div class="ecard"><div>
			<div class="row"><b style="font-size:16px">${esc(x.task.title)}</b><span class="chip">${esc(x.task.category)}</span><span class="chip st s-${healthClass[x.health.status]}"><span class="dot"></span>${healthWord[x.health.status]}</span></div>
			<div class="dim" style="font-size:12.5px;margin-top:2px">${esc(x.task.id)} · inspired by ${esc(x.task.inspiredBy)} · ${esc(x.status)}${st ? ` · ${dur(st.durationMs)} · ${kfmt(st.tokens)} tokens · $${st.usd.toFixed(2)}` : ""}</div>
			${x.best ? `<p class="prose" style="margin:10px 0 0">Best worker <b>${esc(x.best.title)}</b>: ${esc(x.best.details)}</p>` : `<p class="dim">No worker workspace was graded.</p>`}
			${x.health.issues.length ? `<ul class="issues">${x.health.issues.map((i) => `<li class="${i.level}"><b>${esc(i.check)}</b>: ${esc(i.message)}</li>`).join("")}</ul>` : `<p class="dim" style="margin:6px 0 0">All health checks passed.</p>`}
			${x.graded.length > 1 ? `<div class="wbars">${x.graded.map((g) => `<div class="wbar"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(g.title)}</span><span class="track"><i style="width:${(g.score * 100).toFixed(1)}%"></i></span><span class="num">${g.score.toFixed(2)}</span></div>`).join("")}</div>` : ""}
			${st ? `<div class="dim" style="font-size:12.5px;margin-top:10px">${Object.entries(st.agents).map(([k, v]) => `${v} ${esc(ROLE_NAME[k] ?? k)}`).join(" · ")} · findings ${Object.entries(st.findings).map(([k, v]) => `${v} ${k.replace(/_/g, " ")}`).join(", ") || "none"} · ${st.modelErrors} model errors, ${st.retries} retries · ${st.toolErrors}/${st.toolCalls} tool errors${st.parallelism !== undefined ? ` · ${st.parallelism} agents running on average (peak ${st.peakParallelism})` : ""}${st.tokensPerPoint ? ` · ${st.tokensPerPoint === null ? "∞" : kfmt(st.tokensPerPoint)} tokens per point` : ""}${st.oversightShare !== undefined ? ` · oversight ${(st.oversightShare * 100).toFixed(0)}%` : ""}${st.childModelChoices?.length ? ` · managers chose ${st.childModelChoices.map(esc).join(", ")}` : ""}</div>` : ""}
		</div><div style="text-align:right"><div class="big" style="color:${x.score >= 0.8 ? "var(--done)" : x.score >= 0.4 ? "var(--ink)" : "var(--cut)"}">${x.score.toFixed(2)}</div><div class="dim" style="font-size:12px">score</div><button class="btn" style="margin-top:12px" data-openrun="${esc(x.runId)}">Open swarm</button></div></div>`;
	}).join("");
	stage.innerHTML = `<div class="page"><h1 class="view">Evals</h1><p class="lede">Each round runs the suite with hidden graders outside the swarm. Scores run from 0 to 1; ! marks a warning and ✕ a run that broke.</p>
		${matrix}<h3>Round of ${esc(when(round.id))} · mean ${mean(round).toFixed(3)} · ${ok(round)}/${round.results.length} ran without breaking</h3>${cards}</div>`;
	stage.querySelectorAll("[data-round]").forEach((el) => (el.onclick = () => { S.evalRound = el.dataset.round; renderEvals(); }));
	stage.querySelectorAll("[data-openrun]").forEach((el) => (el.onclick = async () => {
		S.runId = el.dataset.openrun; S.sel = null; S.family = null; S.epoch = null; S.fitted = false; S.feed = [];
		$("#run").value = S.runId; connect(); S.view = "swarm"; await refresh(true);
	}));
}

function viewFeed() {
	const allow = FEED_GROUPS[S.feedFilter], q = S.feedQuery.toLowerCase();
	const rows = S.feed.filter((e) => (!allow || allow.includes(e.type)) && !e.type.endsWith(".updated") || (allow && allow.includes(e.type))).filter((e) => !q || `${e.type} ${titleOf(e.nodeId)} ${JSON.stringify(e.data)}`.toLowerCase().includes(q)).slice(-500).reverse();
	return `<h1 class="view">Live feed</h1><p class="lede">Every event as it happens. Click a row to open its agent.</p>
		<div class="filters">${Object.keys(FEED_GROUPS).map((k) => `<button class="${S.feedFilter === k ? "on" : ""}" data-feed="${k}">${k}</button>`).join("")}<input id="feedq" placeholder="Filter by text, agent or type" value="${esc(S.feedQuery)}"></div>
		${rows.length ? rows.map((e) => `<div class="frow ${e.nodeId ? "click" : ""}" ${e.nodeId ? `data-node="${esc(e.nodeId)}" style="cursor:pointer"` : ""}><span class="dim num">${new Date(e.ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" })}</span><span class="ty">${esc(e.type)}</span><span class="soft" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.nodeId ? titleOf(e.nodeId) : "")}</span><span class="code dim" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(JSON.stringify(e.data).slice(0, 260))}</span></div>`).join("") : `<p class="empty">Waiting for events. This feed shows what happens from the moment the page opened.</p>`}`;
}

// ---------- event binding ----------
function bindPage(root) {
	root.querySelectorAll("[data-node]").forEach((el) => (el.onclick = (ev) => { ev.stopPropagation(); selectNode(el.dataset.node); }));
	root.querySelectorAll("[data-finding]").forEach((el) => (el.onclick = (ev) => { ev.stopPropagation(); selectFinding(el.dataset.finding); }));
	root.querySelectorAll("[data-family]").forEach((el) => (el.onclick = () => { S.family = el.dataset.family; selectNode(el.dataset.family); S.drawerTab = "family"; renderAll(); }));
	root.querySelectorAll("[data-family-show]").forEach((el) => (el.onclick = (ev) => { ev.stopPropagation(); S.family = el.dataset.familyShow; S.view = "swarm"; S.sel = el.dataset.familyShow; S.drawerTab = "family"; openDrawer(); renderAll(); }));
	root.querySelectorAll("[data-board]").forEach((el) => (el.onclick = () => { S.boardFam = el.dataset.board; renderView(); }));
	root.querySelectorAll("[data-report]").forEach((el) => (el.onclick = () => { S.reader = el.dataset.report; renderView(); }));
	root.querySelectorAll("[data-sort]").forEach((el) => (el.onclick = () => { const k = el.dataset.sort; S.sort = { key: k, dir: S.sort.key === k ? -S.sort.dir : k === "name" ? 1 : -1 }; renderView(); }));
	root.querySelectorAll("[data-agentfilter]").forEach((el) => (el.onclick = () => { S.agentFilter = el.dataset.agentfilter; renderView(); }));
	root.querySelectorAll("[data-feed]").forEach((el) => (el.onclick = () => { S.feedFilter = el.dataset.feed; renderView(); }));
	const fq = root.querySelector("#feedq");
	if (fq) fq.oninput = () => { S.feedQuery = fq.value; const pos = fq.selectionStart; renderView(); const n = $("#feedq"); n.focus(); n.setSelectionRange(pos, pos); };
	root.querySelectorAll("[data-fill]").forEach((el) => (el.onclick = () => { const t = document.getElementById(`ans-${el.dataset.fill}`); t.value = el.dataset.text; t.focus(); }));
	root.querySelectorAll("[data-answer]").forEach((el) => (el.onclick = async () => {
		const id = el.dataset.answer, answer = document.getElementById(`ans-${id}`).value.trim();
		if (!answer) return;
		el.disabled = true; el.textContent = "Sending…";
		try { await api(`/api/questions/${encodeURIComponent(id)}/answer`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ answer }) }); el.textContent = "Sent. The swarm picks it up within seconds."; }
		catch (e) { el.disabled = false; el.textContent = "Send answer"; alert(e.message); }
	}));
}
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { if (S.family) selectFamily(null); else closeDrawer(); } });
window.addEventListener("resize", () => { if (S.view === "swarm" && !S.fitted) fit(); });

(async () => {
	try { await loadRuns(); connect(); await refresh(); } catch (e) { $("#stage").innerHTML = `<div class="page"><p class="empty">Could not reach the harness: ${esc(e.message)}</p></div>`; }
	setInterval(async () => {
		const typing = [...document.querySelectorAll("textarea, input")].some((t) => t === document.activeElement || (t.tagName === "TEXTAREA" && t.value));
		if (S.reader || typing) return;
		try { await refresh(); } catch {}
	}, 2500);
	setInterval(() => loadRuns().catch(() => {}), 15000);
})();
</script>
