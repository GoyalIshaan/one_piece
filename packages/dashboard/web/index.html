<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>one_piece · swarm telemetry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
	--paper: oklch(97.6% 0.007 85);
	--panel: oklch(99.2% 0.004 85);
	--wash: oklch(94.6% 0.009 80);
	--line: oklch(89.5% 0.009 80);
	--line-2: oklch(83% 0.01 80);
	--ink: oklch(23% 0.014 65);
	--ink-2: oklch(43% 0.013 65);
	--ink-3: oklch(60% 0.011 70);
	--run: oklch(46% 0.104 175);
	--park: oklch(57% 0.075 300);
	--done: oklch(55% 0.11 152);
	--cut: oklch(57% 0.17 33);
	--still: oklch(72% 0.012 80);
	--wait: oklch(70% 0.12 75);
	--focus: oklch(70% 0.15 68);
	--focus-soft: oklch(70% 0.15 68 / 0.16);
	--serif: "Instrument Serif", "Iowan Old Style", Georgia, serif;
	--sans: "Instrument Sans", ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
	--code: ui-monospace, "SF Mono", Menlo, monospace;
	--ease: cubic-bezier(0.22, 1, 0.36, 1);
	color-scheme: light;
}
@media (prefers-color-scheme: dark) {
	:root {
		--paper: oklch(18.5% 0.009 70); --panel: oklch(21.5% 0.009 70); --wash: oklch(25% 0.01 70);
		--line: oklch(30% 0.01 70); --line-2: oklch(37% 0.012 70);
		--ink: oklch(93% 0.008 85); --ink-2: oklch(76% 0.01 80); --ink-3: oklch(60% 0.01 80);
		--run: oklch(70% 0.105 175); --park: oklch(70% 0.07 300); --done: oklch(70% 0.12 152);
		--cut: oklch(68% 0.15 33); --still: oklch(52% 0.012 80); --wait: oklch(78% 0.12 75);
		--focus: oklch(80% 0.14 75); --focus-soft: oklch(80% 0.14 75 / 0.18);
		color-scheme: dark;
	}
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); font-feature-settings: "tnum" 1; -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; }
a { color: var(--run); }
.num { font-variant-numeric: tabular-nums; }
.code { font-family: var(--code); font-size: 12px; }
.dim { color: var(--ink-3); }
.soft { color: var(--ink-2); }

/* ---------- top bar ---------- */
.top { height: 60px; display: flex; align-items: center; gap: 22px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { font-family: var(--serif); font-size: 28px; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
.brand button { border: 0; background: transparent; cursor: pointer; font: inherit; padding: 4px 0; }
.brand i { color: var(--ink-3); }
.runpick { display: flex; flex-direction: column; min-width: 0; }
.runpick label { font-size: 11px; color: var(--ink-3); letter-spacing: .02em; }
.runpick select { appearance: none; border: 0; background: none; font: 600 14px var(--sans); color: var(--ink); padding: 0 18px 0 0; max-width: 360px; text-overflow: ellipsis; cursor: pointer;
	background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: calc(100% - 7px) 9px, calc(100% - 3px) 9px; background-size: 4px 4px; background-repeat: no-repeat; }
.strip { display: flex; gap: 26px; margin-left: auto; align-items: center; }
.metric { display: flex; flex-direction: column; line-height: 1.15; }
.metric b { font-size: 17px; font-weight: 600; }
.metric span { font-size: 11px; color: var(--ink-3); }
.ask-btn { border: 1px solid var(--wait); background: color-mix(in oklch, var(--wait) 14%, var(--panel)); color: var(--ink); border-radius: 999px; padding: 5px 12px; font-weight: 600; cursor: pointer; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 9px; border-radius: 999px; background: var(--wash); color: var(--ink-2); white-space: nowrap; line-height: 1.6; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; background: var(--still); }
.s-running { --c: var(--run); } .s-parked { --c: var(--park); } .s-done { --c: var(--done); } .s-cut, .s-failed { --c: var(--cut); }
.s-merged, .s-archived { --c: var(--still); } .s-pending { --c: var(--line-2); } .s-stopped { --c: var(--wait); }
.s-accepted { --c: var(--done); } .s-rejected { --c: var(--cut); } .s-needs_work, .s-pending_review { --c: var(--wait); } .s-unreviewed { --c: var(--still); }
.chip.st { background: color-mix(in oklch, var(--c, var(--still)) 13%, transparent); color: color-mix(in oklch, var(--c, var(--ink-2)) 80%, var(--ink)); }
.chip.st .dot, .dot.st { background: var(--c, var(--still)); }

/* ---------- layout ---------- */
.app { display: grid; grid-template-columns: 164px minmax(0, 1fr) auto; height: calc(100dvh - 60px); }
.rail { border-right: 1px solid var(--line); padding: 18px 10px; display: flex; flex-direction: column; gap: 2px; background: var(--panel); overflow: auto; }
.rail button { display: flex; align-items: center; justify-content: space-between; gap: 6px; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 7px; color: var(--ink-2); cursor: pointer; font-weight: 500; white-space: nowrap; }
.rail button:hover { background: var(--wash); color: var(--ink); }
.rail button.on { background: var(--wash); color: var(--ink); font-weight: 700; }
.rail button .n { font-size: 11px; color: var(--ink-3); }
.rail button.on .n { color: var(--ink-2); }
.rail button .n.hot { background: var(--wait); color: var(--ink); border-radius: 999px; padding: 0 7px; }
.rail .sep { height: 1px; background: var(--line); margin: 12px 6px; }
.stage { position: relative; overflow: auto; min-width: 0; }
.page { padding: 26px clamp(20px, 3vw, 40px) 60px; max-width: 1180px; }
h1.view { font-family: var(--serif); font-weight: 400; font-size: clamp(32px, 4vw, 51px); line-height: 1.02; letter-spacing: -0.025em; margin: 0 0 8px; overflow-wrap: anywhere; }
.lede { color: var(--ink-2); margin: 0 0 26px; max-width: 70ch; }
h3 { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin: 30px 0 12px; }
.empty { color: var(--ink-3); padding: 30px 0; max-width: 56ch; }

/* ---------- graph ---------- */
.graph { position: relative; min-height: 360px; height: calc(100dvh - 260px); overflow: hidden; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; cursor: grab; }
.graph.drag { cursor: grabbing; }
.graph svg { width: 100%; height: 100%; display: block; }
.link { fill: none; stroke: var(--line-2); stroke-width: 1.3; transition: opacity .3s; }
.link.hi { stroke: var(--focus); stroke-width: 2.2; }
.gnode { cursor: pointer; transition: opacity .3s var(--ease); }
.gnode .body { stroke-width: 2; transition: r .5s var(--ease); }
.gnode.leaf .body { fill: var(--c); stroke: var(--panel); }
.gnode.internal .body { fill: color-mix(in oklch, var(--c) 18%, var(--panel)); stroke: var(--c); stroke-width: 2.6; }
.gnode.root .body { fill: var(--panel); stroke: var(--c); stroke-width: 3; }
.gnode.root .core { fill: var(--c); }
.gnode .halo { fill: none; stroke: var(--focus); stroke-width: 3; opacity: 0; transition: opacity .2s; }
.gnode.sel .halo { opacity: 1; }
.gnode:hover .body { filter: brightness(1.06); }
.glabel { font-size: 11.5px; fill: var(--ink-2); pointer-events: none; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.glabel.strong { fill: var(--ink); font-weight: 600; }
.gsub { font-size: 10.5px; fill: var(--ink-3); pointer-events: none; paint-order: stroke; stroke: var(--paper); stroke-width: 4px; }
.faded { opacity: .18; }
.rnode { cursor: pointer; transition: opacity .3s var(--ease); }
.rnode .rbody { fill: color-mix(in oklch, var(--c) 22%, var(--panel)); stroke: var(--c); stroke-width: 1.6; }
.rnode.s-running .rbody { fill: var(--c); }
.rnode text { font-size: 8.5px; font-weight: 700; fill: var(--ink); pointer-events: none; text-anchor: middle; }
.rnode.s-running text { fill: var(--panel); }
.rnode.sel .rhalo { opacity: 1; }
.rnode .rhalo { fill: none; stroke: var(--focus); stroke-width: 2.5; opacity: 0; }
.rnode.old { opacity: .55; }
.rlink { fill: none; stroke: var(--wait); stroke-width: 1.1; stroke-dasharray: 3 3; opacity: .8; }
.rlink.old { opacity: .3; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.gtools { position: absolute; left: 16px; top: 14px; display: flex; gap: 8px; align-items: center; z-index: 2; flex-wrap: wrap; }
.gtools .group { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.gtools .group button { border: 0; background: none; padding: 5px 10px; cursor: pointer; color: var(--ink-2); }
.gtools .group button + button { border-left: 1px solid var(--line); }
.gtools .group button:hover { background: var(--wash); color: var(--ink); }
.gtools .group button.on { background: var(--ink); color: var(--paper); }
.layer { stroke: var(--line); stroke-dasharray: 3 5; }
.layer-name { font: 600 12px var(--sans); fill: var(--ink-2); }
.gnode:focus-visible .halo, .rnode:focus-visible .rhalo { opacity: 1; }
.glabel { font-size: 14px; fill: var(--ink); stroke: var(--panel); }
.gsub { font-size: 11.5px; fill: var(--ink-2); stroke: var(--panel); }
.gstate { font-size: 11px; font-weight: 600; fill: var(--c); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; }
.graphHeading { display: flex; gap: 16px; align-items: flex-end; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; }
.graphHeading p { margin: 5px 0 0; }
.graphKey { display: flex; gap: 8px 18px; flex-wrap: wrap; margin: 10px 0 0; color: var(--ink-2); font-size: 12px; }
.graphKey span { display: inline-flex; gap: 5px; align-items: center; }
.tree-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tree-tools label { font-size: 12px; color: var(--ink-2); }
.tree-tools select, .tree-tools input { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line-2); padding: 5px 8px; border-radius: 5px; }

/* ---------- drawer ---------- */
.drawer { width: 0; overflow: hidden; border-left: 1px solid var(--line); background: var(--panel); transition: width .35s var(--ease); }
.drawer.open { width: min(460px, 42vw); }
.drawer .inner { width: min(460px, 42vw); height: 100%; display: flex; flex-direction: column; }
.dhead { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
.dhead .kicker { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--ink-3); }
.dhead h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.15; margin: 6px 0 4px; }
.dhead h2 { overflow-wrap: anywhere; }
.dhead .close { margin-left: auto; border: 0; background: none; font-size: 20px; color: var(--ink-3); cursor: pointer; padding: 0 2px; }
.tabs { display: flex; gap: 2px; padding: 0 14px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 9px 9px; color: var(--ink-3); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; font-weight: 500; }
.tabs button.on { color: var(--ink); border-color: var(--ink); }
.dbody { padding: 16px 20px 40px; overflow: auto; flex: 1; }
.agent-now { border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 12px; }
.agent-now h3 { margin-top: 0; }
.agent-now p { margin: 5px 0; }
.agent-now .box { background: var(--paper); }
.kv { display: grid; grid-template-columns: 104px 1fr; gap: 7px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--ink-3); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.prose { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; color: var(--ink); }
.box { background: var(--wash); border-radius: 8px; padding: 10px 12px; margin: 6px 0; }
.gauges { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin: 4px 0 6px; }
.gauge { padding: 10px 0 0; border-top: 2px solid var(--line); }
.gauge b { font-size: 19px; font-weight: 600; display: block; }
.gauge span { font-size: 11.5px; color: var(--ink-3); }
.bar { height: 6px; border-radius: 3px; background: var(--wash); overflow: hidden; margin-top: 6px; }
.bar i { display: block; height: 100%; background: var(--ink-2); border-radius: 3px; }
.tl { position: relative; padding-left: 18px; }
.tl::before { content: ""; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 1px; background: var(--line); }
.tl .ev { position: relative; margin: 0 0 12px; }
.tl .ev::before { content: ""; position: absolute; left: -17px; top: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--panel); border: 2px solid var(--ink-3); }
.tl .ev.think::before { border-color: var(--park); }
.tl .ev.tool::before { border-color: var(--run); }
.tl .ev.res::before { border-color: var(--done); }
.tl .ev.err::before { border-color: var(--cut); }
.tl .ev.msg::before { border-color: var(--wait); background: var(--wait); }
.tl .meta { font-size: 11.5px; color: var(--ink-3); }
.tl .meta b { color: var(--ink-2); font-weight: 600; }
details.fold summary { cursor: pointer; list-style: none; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold[open] summary .more { display: none; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; font-family: var(--code); font-size: 11.5px; background: var(--wash); border-radius: 6px; padding: 7px 9px; margin-top: 4px; max-height: 260px; overflow: auto; color: var(--ink-2); }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 13px; }
.crumbs button, .linkbtn { border: 0; background: none; padding: 1px 2px; color: var(--run); cursor: pointer; text-align: left; }
.crumbs .sep { color: var(--ink-3); }
.mlist { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.mrow { display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; background: var(--panel); cursor: pointer; }
.mrow:hover { background: var(--wash); }
.mrow .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .a { grid-column: 2 / 4; font-size: 12px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: -4px; }
.btn { border: 1px solid var(--line-2); background: var(--panel); border-radius: 7px; padding: 5px 11px; cursor: pointer; font-weight: 500; }
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.focus { border-color: var(--focus); background: var(--focus-soft); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- tables, lists ---------- */
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12px; padding: 7px 10px; border-bottom: 1px solid var(--line-2); white-space: nowrap; cursor: default; }
th.sort { cursor: pointer; } th.sort:hover { color: var(--ink); }
td { padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--wash); }
td.r, th.r { text-align: right; }
.hbar { display: grid; grid-template-columns: minmax(140px, 260px) 1fr 110px; gap: 12px; align-items: center; padding: 6px 0; font-size: 13px; cursor: pointer; }
.hbar:hover .lbl { color: var(--ink); }
.hbar .lbl { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar .track { position: relative; height: 14px; background: var(--wash); border-radius: 3px; }
.hbar .fill { position: absolute; inset: 0 auto 0 0; border-radius: 3px; background: var(--ink-2); }
.hbar .cap { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); }
.hbar .v { text-align: right; }
.split { display: flex; height: 26px; border-radius: 4px; overflow: hidden; margin: 8px 0 10px; }
.split div { height: 100%; }
.keys { display: flex; gap: 18px; flex-wrap: wrap; font-size: 13px; color: var(--ink-2); }
.keys span { display: inline-flex; align-items: center; gap: 7px; }
.sq { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.chart text { fill: var(--ink-3); font-size: 11px; font-family: var(--sans); }
.cols2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 30px 40px; }

/* Run overview */
.monitor { max-width: 1440px; padding-top: clamp(24px, 4vw, 48px); }
.run-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; color: var(--ink-2); font-size: 13px; }
.monitor h1 { max-width: 23ch; margin: 12px 0 18px; }
.run-stats { display: grid; grid-template-columns: 1.35fr 1fr 1fr 1fr; border-block: 1px solid var(--line-2); margin-top: 26px; }
.run-stat { min-width: 0; padding: 14px 16px; }
.run-stat:first-child { padding-left: 0; }
.run-stat + .run-stat { border-left: 1px solid var(--line); }
.run-stat dt { color: var(--ink-2); font-size: 12px; margin-bottom: 4px; }
.run-stat dd { margin: 0; font-variant-numeric: tabular-nums; line-height: 1.3; }
.run-stat strong { display: block; font-size: clamp(18px, 2.5vw, 27px); letter-spacing: -.035em; font-weight: 600; }
.run-stat small { color: var(--ink-2); font-size: 12px; }
.run-stat.over strong { color: var(--cut); }
.monitor section { margin-top: 32px; }
.section-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.section-head h2, .chart-pane h2 { margin: 0; font-size: 17px; letter-spacing: -.02em; font-weight: 650; }
.section-head p, .chart-pane p { margin: 3px 0 0; color: var(--ink-2); }
.chart-grid { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 20px 24px; }
.chart-pane { min-width: 0; border-top: 1px solid var(--line-2); padding-top: 12px; }
.chart-pane svg { display: block; overflow: visible; }
.chart-key { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--ink-2); font-size: 12px; margin: 8px 0 5px; }
.chart-key span { display: inline-flex; align-items: center; gap: 6px; }
.chart-key i { width: 14px; height: 2px; background: var(--key); display: inline-block; }
.inspectChart { touch-action: pan-y; }
.chart-readout { color: var(--ink-2); font-size: 12px; display: block; min-height: 18px; font-variant-numeric: tabular-nums; }
.chart-guideline { pointer-events: none; stroke: var(--line-2); stroke-width: 1; }
.monitor-table { border-top: 1px solid var(--line-2); overflow: auto; }
.monitor-table th:first-child, .monitor-table td:first-child { padding-left: 0; }
.monitor-table tbody tr:hover { background: var(--wash); }
.agent-name { font-weight: 650; color: var(--ink); }
.agent-action { color: var(--ink-2); overflow-wrap: anywhere; min-width: 16ch; }
.agent-row { display: flex; align-items: baseline; gap: 6px; }
.table-state { white-space: nowrap; color: color-mix(in oklch, var(--c, var(--ink-2)) 70%, var(--ink)); }
.outline-name { min-width: 20ch; }
.outline-name .agent-row { margin-left: calc(min(var(--depth), 6) * 13px); }
.outline-branch { border-left: 1px solid var(--line-2); padding-left: 9px; }

:where(button, input, select, a):focus-visible { outline: 2px solid var(--run); outline-offset: 3px; }

/* families */
.fam { display: grid; grid-template-columns: 96px 1fr auto; gap: 18px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.fam:hover .ft { text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 3px; }
.fam .ft { font-weight: 600; font-size: 15px; }
.fam .fs { display: flex; gap: 16px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; margin-top: 4px; }
.fam.on { background: linear-gradient(90deg, var(--focus-soft), transparent 70%); }

/* findings */
.find { display: grid; grid-template-columns: 110px 1fr 120px; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; align-items: start; }
.find:hover .claim { color: var(--ink); }
.find .claim { color: var(--ink-2); }
.steps { display: flex; gap: 4px; margin-top: 6px; }
.steps i { width: 18px; height: 5px; border-radius: 3px; background: var(--c); }
.lvl { font-size: 11px; letter-spacing: .03em; text-transform: uppercase; color: var(--ink-3); }

/* boards */
.boards { display: grid; grid-template-columns: 230px 1fr; gap: 28px; }
.blist button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 7px; cursor: pointer; color: var(--ink-2); }
.blist button.on { background: var(--wash); color: var(--ink); font-weight: 600; }
.blist button .n { float: right; color: var(--ink-3); font-weight: 400; }
.cps { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.cp { border-top: 2px solid var(--c, var(--line-2)); padding-top: 8px; }
.cp .who { font-weight: 600; font-size: 13px; }
.post { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--wash); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--ink-2); }
.post .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); }
.post.peer_review .kind { color: var(--done); }

/* epochs */
.etrack { display: flex; height: 54px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); margin: 6px 0 24px; }
.etrack div { display: flex; flex-direction: column; justify-content: center; padding: 0 12px; border-right: 1px solid var(--line); background: var(--panel); min-width: 90px; cursor: pointer; }
.etrack div.cur { background: var(--focus-soft); }
.etrack b { font-size: 13px; } .etrack span { font-size: 11.5px; color: var(--ink-3); }
.epoch { padding: 18px 0 22px; border-bottom: 1px solid var(--line); }

/* inbox */
.q { padding: 18px 20px; border: 1px solid var(--wait); background: color-mix(in oklch, var(--wait) 7%, var(--panel)); border-radius: 10px; margin-bottom: 14px; }
.q h4 { margin: 0 0 6px; font-size: 16px; }
.q textarea { width: 100%; min-height: 72px; margin-top: 10px; border: 1px solid var(--line-2); border-radius: 8px; padding: 9px 10px; font: inherit; background: var(--panel); color: var(--ink); resize: vertical; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.report-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.report-row:hover b { text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line-2); }
.md { max-width: 78ch; font-size: 15px; line-height: 1.65; }
.md h1 { font-family: var(--serif); font-weight: 400; font-size: 34px; line-height: 1.15; margin: 0 0 14px; }
.md h2 { font-family: var(--serif); font-weight: 400; font-size: 25px; margin: 30px 0 8px; }
.md h3 { margin-top: 24px; }
.md table { font-size: 12.5px; margin: 10px 0; display: block; overflow-x: auto; }
.md td { border: 1px solid var(--line); }
.md code { font-family: var(--code); font-size: 12.5px; background: var(--wash); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--wash); padding: 10px 12px; border-radius: 8px; overflow: auto; font-size: 12.5px; }

/* evals */
.matrix td.cell { text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; border-left: 1px solid var(--panel); }
.matrix th.col { text-align: center; font-size: 11px; }
.ecard { display: grid; grid-template-columns: 1fr 140px; gap: 18px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.ecard .big { font-size: 34px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.issues { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
.issues li.fail { color: var(--cut); }
.issues li.info { color: var(--ink-3); }
.issues li.warn { color: color-mix(in oklch, var(--wait) 70%, var(--ink)); }
.wbars { display: grid; gap: 4px; margin-top: 10px; }
.wbar { display: grid; grid-template-columns: minmax(120px, 220px) 1fr 50px; gap: 10px; align-items: center; font-size: 12.5px; color: var(--ink-2); }
.wbar .track { height: 8px; background: var(--wash); border-radius: 4px; overflow: hidden; }
.wbar .track i { display: block; height: 100%; background: var(--done); }
/* feed */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
.filters button { border: 1px solid var(--line-2); background: var(--panel); border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: 12.5px; color: var(--ink-2); }
.filters button.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.filters input { border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 12px; font: inherit; font-size: 13px; background: var(--panel); color: var(--ink); min-width: 220px; }
.frow { display: grid; grid-template-columns: 72px 130px minmax(120px, 200px) 1fr; gap: 12px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
.frow .ty { color: var(--ink-2); font-weight: 600; }

@media (max-width: 1020px) {
	.app { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr); }
	.rail { grid-column: 1 / -1; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; }
	.rail .sep { display: none; }
	.drawer.open, .drawer .inner { width: clamp(300px, 39vw, 420px); }
	.strip .metric:nth-child(n+3) { display: none; }
	.boards { grid-template-columns: 1fr; }
}
@media (max-width: 700px) {
	.app { grid-template-columns: minmax(0, 1fr); }
	.top { gap: 12px; padding: 0 12px; }
	.runpick select { max-width: 43vw; }
	.strip { gap: 0; }
	.strip .metric:first-child { display: none; }
	.strip .metric b { font-size: 14px; }
	.chart-grid { grid-template-columns: 1fr; }
	.run-stats { grid-template-columns: 1fr 1fr; }
	.run-stat:nth-child(3) { padding-left: 0; border-left: 0; }
	.run-stat:nth-child(n+3) { border-top: 1px solid var(--line); }
	.graph { height: min(620px, 60dvh); }
	.drawer.open { position: fixed; inset: 110px 0 0 auto; z-index: 10; }
	.drawer.open, .drawer .inner { width: min(100vw, 440px); }
	.ecard { grid-template-columns: minmax(0, 1fr) 92px; }
	.matrix { min-width: 560px; }
}
</style>
</head>
<body>
<header class="top">
	<div class="brand"><button type="button" onclick="go('overview')" aria-label="one_piece run overview">one<i>_</i>piece</button></div>
	<div class="runpick"><label for="run">Run</label><select id="run"></select></div>
	<div class="strip" id="strip"></div>
</header>
<div class="app">
	<nav class="rail" id="rail" aria-label="Dashboard"></nav>
	<section class="stage" id="stage"></section>
	<aside class="drawer" id="drawer"><div class="inner" id="dinner"></div></aside>
</div>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (n) => Math.round(n ?? 0).toLocaleString();
const kfmt = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(n >= 1e7 ? 0 : 1)}M` : n >= 1e3 ? `${(n / 1e3).toFixed(n >= 1e4 ? 0 : 1)}k` : `${Math.round(n ?? 0)}`);
const ago = (ts) => { const s = Math.max(0, Math.round((Date.now() - ts) / 1000)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} h ago` : new Date(ts).toLocaleDateString(); };
const dur = (ms) => { const s = Math.round(ms / 1000); return s < 60 ? `${s}s` : s < 3600 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`; };
const ROLE_NAME = { root: "Root", internal: "Explorer", leaf: "Worker", claims_reviewer: "Claims reviewer", hidden_reviewer: "Hidden reviewer", root_reviewer: "Root reviewer" };
const TREE = new Set(["root", "internal", "leaf"]);
const LIVE = new Set(["running", "parked", "pending"]);
const statusChip = (s) => `<span class="chip st s-${esc(s)}"><span class="dot"></span>${esc(String(s).replace(/_/g, " "))}</span>`;

const S = { state: null, runId: null, view: "overview", treeMode: "graph", reviewers: "all", sel: null, selFinding: null, family: null, epoch: null, drawerTab: "overview", feed: [], feedFilter: "all", feedQuery: "", sort: { key: "tokens", dir: -1 }, boardFam: null, reader: null, zoom: { k: 1, x: 0, y: 0 }, fitted: false, source: null };

// ---------- data ----------
async function api(path, init) { const r = await fetch(path, init); if (!r.ok) throw new Error((await r.text()) || r.statusText); return r.json(); }
async function loadRuns() {
	const runs = await api("/api/runs");
	const sel = $("#run");
	sel.innerHTML = runs.map((r) => `<option value="${esc(r.id)}">${esc(r.goal.title)} — ${esc(r.status)}, ${new Date(r.createdAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })}</option>`).join("") || "<option>No runs yet</option>";
	if (!runs.some((run) => run.id === S.runId)) S.runId = runs[0]?.id ?? null;
	if (S.runId) sel.value = S.runId;
	sel.onchange = () => { S.runId = sel.value; S.sel = null; S.family = null; S.epoch = null; S.feed = []; S.fitted = false; closeDrawer(); connect(); refresh(true); };
}
async function connect() {
	S.source?.close();
	const runId = S.runId;
	const version = S.connectionVersion = (S.connectionVersion ?? 0) + 1;
	if (!runId) return;
	const endpoint = `/api/runs/${encodeURIComponent(runId)}`;
	const recent = await api(`${endpoint}/events?limit=240`).catch(() => []);
	if (version !== S.connectionVersion) return;
	S.feed = recent;
	if (S.view === "feed") renderView();
	const after = recent.at(-1)?.seq;
	const source = new EventSource(`${endpoint}/stream${after === undefined ? "" : `?after=${after}`}`);
	S.source = source;
	source.onmessage = (m) => {
		if (version !== S.connectionVersion) return;
		const { events } = JSON.parse(m.data);
		S.feed.push(...events); if (S.feed.length > 3000) S.feed = S.feed.slice(-3000);
		if (S.view === "feed") renderView();
		if (S.sel && S.drawerTab === "activity" && events.some((e) => e.nodeId === S.sel)) renderDrawer();
	};
}
async function refresh(force) {
	if (!S.runId) { renderAll(); return; }
	const runId = S.runId;
	const st = await api(`/api/runs/${encodeURIComponent(runId)}/state`);
	if (runId !== S.runId) return;
	// Re-render only when something happened, so the page never flickers under the pointer.
	if (!force && S.state && st.lastSeq === S.state.lastSeq && st.run?.id === S.state.run?.id) return;
	st.byId = Object.fromEntries(st.nodes.map((n) => [n.id, n]));
	st.tree = st.nodes.filter((n) => TREE.has(n.role));
	// own = the agent's own model calls; over = what background reviewers spent on it;
	// sub = its whole branch (own + oversight of itself and every descendant).
	st.own = {}; st.over = {}; st.sub = {};
	for (const n of st.nodes) { st.own[n.id] = n.spent?.tokens ?? 0; st.over[n.id] = n.oversight?.tokens ?? 0; }
	const subOf = (id) => { if (st.sub[id] !== undefined) return st.sub[id]; const n = st.byId[id]; if (!n) return 0; return (st.sub[id] = st.own[id] + st.over[id] + (n.children || []).filter((c) => TREE.has(st.byId[c]?.role)).reduce((a, c) => a + subOf(c), 0)); };
	for (const n of st.nodes) subOf(n.id);
	st.reviewersOf = {};
	for (const n of st.nodes) if (n.targetNodeId && !TREE.has(n.role)) (st.reviewersOf[n.targetNodeId] ??= []).push(n);
	S.state = st;
	renderAll();
}

// ---------- helpers on state ----------
const nodeOf = (id) => S.state?.byId[id];
const titleOf = (id) => nodeOf(id)?.goal.title ?? id;
const relativeTime = (timestamp) => `<time data-relative="${timestamp}" datetime="${new Date(timestamp).toISOString()}">${ago(timestamp)}</time>`;
function rootOfEpoch(epoch) { const e = S.state.epochs.find((x) => x.number === epoch); return e ? nodeOf(e.rootNodeId) : S.state.tree.find((n) => n.role === "root"); }
function families() {
	return S.state.tree.filter((n) => n.children?.some((c) => TREE.has(nodeOf(c)?.role))).map((head) => {
		const members = head.children.map(nodeOf).filter((m) => m && TREE.has(m.role));
		const ids = new Set(members.map((m) => m.id));
		return {
			head, members,
			tokens: members.reduce((a, m) => a + S.state.sub[m.id], 0), // children's branches; the parent's own spend is separate
			running: members.filter((m) => m.status === "running").length,
			live: members.filter((m) => LIVE.has(m.status)).length,
			accepted: S.state.findings.filter((f) => f.status === "accepted" && [...ids].some((i) => i === f.nodeId || isDescendant(f.nodeId, i))).length,
			posts: S.state.posts.filter((p) => p.familyId === head.id).length,
			recs: S.state.recommendations.filter((r) => r.status === "open" && r.deciderNodeId === head.id).length,
		};
	});
}
function isDescendant(id, ancestorId) { let n = nodeOf(id); while (n?.parentId) { if (n.parentId === ancestorId) return true; n = nodeOf(n.parentId); } return false; }
function lineage(id) { const out = []; let n = nodeOf(id); while (n?.parentId) { n = nodeOf(n.parentId); if (n) out.unshift(n); } return out; }

// ---------- chrome ----------
function renderStrip() {
	const st = S.state, r = st?.run;
	if (!r) { $("#strip").innerHTML = ""; return; }
	const total = st.nodes.reduce((a, n) => a + (n.spent?.tokens ?? 0), 0);
	const frac = r.budget.tokens ? total / r.budget.tokens : 0;
	const waiting = st.questions.filter((q) => q.holder === "user" && q.status !== "answered").length;
	$("#strip").innerHTML = `
		<div class="metric">${statusChip(r.status)}</div>
		<div class="metric"><b class="num"${frac > 1 ? ' style="color:var(--cut)"' : ""}>${kfmt(total)}${r.budget.tokens ? ` / ${kfmt(r.budget.tokens)}` : ""}</b><span>Run tokens${frac > 1 ? ` · ${((frac - 1) * 100).toFixed(1)}% over` : ""}</span></div>
		${waiting ? `<button class="ask-btn" onclick="go('inbox')">${waiting} question${waiting > 1 ? "s" : ""} for you</button>` : ""}`;
}
const NAVIGATION = [
	[["overview", "Overview"], ["swarm", "Agent tree"], ["tokens", "Token budget"], ["feed", "Activity log"]],
	[["findings", "Findings"], ["families", "Families"], ["boards", "Boards"], ["epochs", "Epochs"], ["inbox", "Inbox"]],
	[["evals", "Evals"]],
];
function renderRail() {
	const st = S.state;
	const count = { families: st ? families().length : 0, findings: st?.findings.length ?? 0, boards: st?.posts.length ?? 0, epochs: st?.epochs.length ?? 0 };
	const waiting = st ? st.questions.filter((q) => q.holder === "user" && q.status !== "answered").length : 0;
	$("#rail").innerHTML = NAVIGATION.map((group) => group.map(([key, label]) => `<button type="button" class="${S.view === key ? "on" : ""}"${S.view === key ? ' aria-current="page"' : ""} onclick="go('${key}')">${label}${key === "inbox" && waiting ? `<span class="n hot">${waiting}</span>` : count[key] ? `<span class="n num">${count[key]}</span>` : ""}</button>`).join("")).join('<div class="sep" role="presentation"></div>');
}
function go(view) {
	if (S.view !== view) { $("#stage").scrollTop = 0; S.graphResize?.disconnect(); }
	S.view = view; S.reader = null; renderAll();
}
function renderAll() { renderStrip(); renderRail(); renderView(); renderDrawer(); }

// ---------- views ----------
function renderView() {
	const stage = $("#stage");
	if (S.view === "evals") return renderEvals();
	if (!S.state?.run) { stage.innerHTML = `<div class="page"><h1 class="view">No runs yet</h1><p class="lede">Start one from a project folder: <span class="code">one-piece run "your goal" --dashboard</span>. This page fills in as the swarm works.</p></div>`; return; }
	if (S.reader) return renderReader();
	if (S.view === "swarm") return renderSwarm();
	const page = { overview: viewOverview, families: viewFamilies, findings: viewFindings, boards: viewBoards, tokens: viewTokens, epochs: viewEpochs, inbox: viewInbox, feed: viewFeed }[S.view]();
	const keepScroll = stage.scrollTop;
	stage.innerHTML = `<div class="page ${S.view === "overview" ? "monitor" : ""}">${page}</div>`;
	stage.scrollTop = keepScroll;
	bindPage(stage);
	if (S.view === "overview") bindCharts(stage);
}

function nodeDisplayName(node) {
	return TREE.has(node.role) ? node.goal.title.replace(/^\[eval(?: solo)?\]\s*/, "") : `${ROLE_NAME[node.role]} · ${titleOf(node.targetNodeId) ?? "run"}`;
}

function shortLabel(text, limit) {
	return text.length > limit ? `${text.slice(0, limit - 1).trimEnd()}…` : text;
}

function agentStatus(node) {
	if (node.status !== "done") return { label: node.status, kind: node.status };
	const reason = node.statusReason ?? "";
	if (/^needs_input:/i.test(reason)) return { label: "blocked", kind: "stopped" };
	if (/^(stopped:|run budget |eval time limit)/i.test(reason)) return { label: "stopped", kind: "stopped" };
	return { label: "done", kind: "done" };
}

function activityLabel(node) {
	if (!LIVE.has(node.status) && node.statusReason) return node.statusReason.replace(/^finished:\s*/i, "");
	if (node.status === "parked") return node.activity || "Waiting for a result";
	return node.activity || (node.status === "pending" ? "Waiting for a slot" : node.status === "running" ? "Starting next turn" : "—");
}

function agentLink(node, label = nodeDisplayName(node)) {
	return `<button type="button" class="linkbtn agent-name" data-node="${esc(node.id)}">${esc(label)}</button>`;
}

function agentRows(entries, outline = false) {
	return `<div class="monitor-table"><table>
		<thead><tr><th>Agent</th><th>Status</th><th>${outline ? "Latest action" : "Recent activity"}</th><th class="r">Own tokens</th>${outline ? '<th class="r">Branch / allocation</th>' : ""}</tr></thead>
		<tbody>${entries.map(({ node, depth = 0 }) => {
			const st = S.state;
			const state = agentStatus(node);
			return `<tr><td class="outline-name" style="--depth:${depth}"><div class="agent-row ${depth ? "outline-branch" : ""}">${agentLink(node)}</div><div class="agent-row dim">${esc(ROLE_NAME[node.role])}</div></td>
			<td><span class="table-state s-${esc(state.kind)}">${esc(state.label)}</span></td>
			<td class="agent-action" title="${esc(activityLabel(node))}">${esc(shortLabel(activityLabel(node), 140))}${st.series.activity?.[node.id] ? `<div class="dim">${relativeTime(st.series.activity[node.id])}</div>` : ""}</td>
			<td class="r num">${fmt(st.own[node.id])}</td>${outline ? `<td class="r num">${TREE.has(node.role) ? `${kfmt(st.sub[node.id])}${node.budget.tokens ? ` / ${kfmt(node.budget.tokens)}` : ""}` : "—"}</td>` : ""}</tr>`;
		}).join("")}</tbody></table></div>`;
}

function viewOverview() {
	const st = S.state, run = st.run;
	const limit = run.budget.tokens;
	const tokens = Object.values(st.own).reduce((total, spent) => total + spent, 0);
	const usd = st.nodes.reduce((total, node) => total + (node.spent?.usd ?? 0), 0);
	const running = st.nodes.filter((node) => node.status === "running").length;
	const waiting = st.nodes.filter((node) => node.status === "parked" || node.status === "pending").length;
	const accepted = st.findings.filter((finding) => finding.status === "accepted").length;
	const latest = st.series.lastEventAt ?? run.updatedAt;
	const live = run.status === "running";
	const time = (ts) => new Date(ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
	const agents = [...st.nodes].sort((a, b) => Number(LIVE.has(b.status)) - Number(LIVE.has(a.status)) || (st.series.activity?.[b.id] ?? b.updatedAt) - (st.series.activity?.[a.id] ?? a.updatedAt)).slice(0, 7);
	const started = new Date(run.createdAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
	const spentLabel = limit ? (tokens > limit ? `${fmt(tokens - limit)} over the ${fmt(limit)} cap` : `${fmt(limit - tokens)} remaining of ${fmt(limit)}`) : "No token cap set";
	const chartRange = { start: run.createdAt, end: latest };
	return `<div class="run-meta">${statusChip(run.status)}<span>Started ${esc(started)}</span><span>${dur(latest - run.createdAt)} elapsed</span>${live ? `<span>Last event ${relativeTime(latest)}</span>` : `<span>Last event at ${esc(time(latest))}</span>`}</div>
		<h1 class="view">${esc(run.goal.title.replace(/^\[eval(?: solo)?\]\s*/, ""))}</h1>
		<div class="row"><button class="btn primary" type="button" onclick="go('swarm')">Explore agent tree</button><button class="btn" type="button" onclick="go('inbox')">Reports &amp; inbox</button></div>
		<dl class="run-stats">
			<div class="run-stat ${limit && tokens > limit ? "over" : ""}"><dt>Run token budget</dt><dd><strong>${fmt(tokens)}</strong><small>${spentLabel}</small></dd></div>
			<div class="run-stat"><dt>Agents running</dt><dd><strong>${running}</strong><small>${waiting} waiting · ${st.nodes.length} launched</small></dd></div>
			<div class="run-stat"><dt>Accepted findings</dt><dd><strong>${accepted}</strong><small>${st.findings.length} submitted</small></dd></div>
			<div class="run-stat"><dt>Estimated cost</dt><dd><strong>$${usd.toFixed(2)}</strong><small>Epoch ${run.epoch}</small></dd></div>
		</dl>
		<section aria-label="Run progression" class="chart-grid">
			<div class="chart-pane"><div class="section-head"><h2>Token spend over time</h2><button class="linkbtn" type="button" onclick="go('tokens')">Budget details →</button></div>
				${inspectionChart("spend", [{ label: "Total", points: st.series.tokens, color: "var(--run)" }, { label: "Reviewers", points: st.series.reviewerTokens ?? [], color: "var(--wait)" }], { ...chartRange, cap: limit, marks: st.series.stages ?? [], label: "Cumulative token spend and run cap" })}</div>
			<div class="chart-pane"><h2>Agents &amp; findings</h2>
				${inspectionChart("progress", [{ label: "Running agents", points: st.series.active ?? [], color: "var(--park)" }, { label: "Accepted findings", points: st.series.accepted, color: "var(--done)" }], { ...chartRange, counts: true, label: "Number of agents running and accepted findings over time" })}</div>
		</section>
		<section><div class="section-head"><h2>Agent activity</h2><button type="button" class="linkbtn" onclick="go('feed')">Activity log →</button></div>
			${agents.length ? agentRows(agents.map((node) => ({ node }))) : '<p class="dim">Agent activity appears after the root starts.</p>'}</section>`;
}

function inspectionChart(id, traces, options) {
	const width = id === "spend" ? 640 : 380;
	const height = 178, left = 46, right = width - 18, top = 19, bottom = 152;
	const start = options.start, end = Math.max(start + 1000, options.end);
	const values = traces.flatMap((trace) => trace.points.map((point) => point[1]));
	const max = Math.max(options.counts ? 3 : 1, options.cap ?? 0, ...values);
	const roughStep = max / 4;
	const magnitude = 10 ** Math.floor(Math.log10(roughStep));
	const step = options.counts ? Math.max(1, Math.ceil(roughStep)) : [1, 2, 2.5, 5, 10].find((unit) => unit * magnitude >= roughStep) * magnitude;
	const ticks = Math.ceil(max / step);
	const x = (t) => left + (t - start) / (end - start) * (right - left);
	const y = (value) => bottom - value / (ticks * step) * (bottom - top);
	const axis = Array.from({ length: ticks + 1 }, (_, i) => `<line x1="${left}" x2="${right}" y1="${y(i * step)}" y2="${y(i * step)}" stroke="var(--line)"/><text x="${left - 8}" y="${y(i * step) + 4}" text-anchor="end">${kfmt(i * step)}</text>`).join("");
	const times = [0, .5, 1].map((f) => `<text x="${x(start + f * (end - start))}" y="${height - 6}" text-anchor="${f === 0 ? "start" : f === 1 ? "end" : "middle"}">${dur(f * (end - start))}</text>`).join("");
	const cap = options.cap ? `<line x1="${left}" x2="${right}" y1="${y(options.cap)}" y2="${y(options.cap)}" stroke="var(--cut)" stroke-dasharray="4 4"/><text x="${right - 3}" y="${y(options.cap) - 5}" text-anchor="end" style="fill:var(--cut)">Cap ${kfmt(options.cap)}</text>` : "";
	const marks = (options.marks ?? []).map((mark) => `<line x1="${x(mark.t)}" x2="${x(mark.t)}" y1="${top}" y2="${bottom}" stroke="var(--ink-3)" stroke-dasharray="2 4"><title>${esc(mark.label)} at ${dur(mark.t - start)}</title></line>`).join("");
	const lines = traces.map((trace) => {
		const path = trace.points.reduce((d, [t, value]) => `${d}H${x(t).toFixed(1)}V${y(value).toFixed(1)}`, `M${left} ${bottom}`);
		return `<path d="${path}H${right}" fill="none" stroke="${trace.color}" stroke-width="2.2"/>`;
	}).join("");
	const readout = (t) => `${dur(t - start)} · ${traces.map((trace) => `${trace.label} ${fmt(trace.points.findLast(([at]) => at <= t)?.[1] ?? 0)}`).join(" · ")}`;
	(S.charts ??= {})[id] = { left, right, start, end, width, readout };
	return `<div class="chart-key">${traces.map((trace) => `<span><i style="--key:${trace.color}"></i>${esc(trace.label)}</span>`).join("")}</div>
		<svg class="chart inspectChart" viewBox="0 0 ${width} ${height}" width="100%" role="img" aria-label="${esc(options.label)}" data-chart="${id}">${axis}${times}${marks}${cap}${lines}<line class="chart-guideline" x1="0" x2="0" y1="${top}" y2="${bottom}" visibility="hidden"/></svg>
		<output class="chart-readout" data-chart-output="${id}">${esc(readout(end))}</output>`;
}

function bindCharts(parent) {
	parent.querySelectorAll("[data-chart]").forEach((svg) => {
		const { start, end, left, right, width, readout } = S.charts[svg.dataset.chart];
		const output = parent.querySelector(`[data-chart-output="${svg.dataset.chart}"]`);
		const line = $(".chart-guideline", svg);
		svg.onpointermove = (event) => {
			const rect = svg.getBoundingClientRect();
			const x = Math.min(right, Math.max(left, (event.clientX - rect.left) / rect.width * width));
			line.setAttribute("x1", x); line.setAttribute("x2", x); line.setAttribute("visibility", "visible");
			output.textContent = readout(start + (x - left) / (right - left) * (end - start));
		};
		svg.onpointerleave = () => { line.setAttribute("visibility", "hidden"); output.textContent = readout(end); };
	});
}

// ---------- swarm graph ----------
const COLUMN_WIDTH = 254;
const REV_LETTER = { hidden_reviewer: "H", claims_reviewer: "C", root_reviewer: "E" };
const treeChildren = (node) => (node.children || []).map(nodeOf).filter((child) => child && TREE.has(child.role));
const shownReviews = (node) => S.reviewers === "off" ? [] : (S.state.reviewersOf[node.id] ?? []).filter((reviewer) => S.reviewers === "all" || LIVE.has(reviewer.status));

function treeEntries(root, depth = 0) {
	const nodeEntries = [{ node: root, depth }, ...shownReviews(root).map((node) => ({ node, depth: depth + 1 }))];
	return nodeEntries.concat(treeChildren(root).flatMap((child) => treeEntries(child, depth + 1)));
}

function layoutTree(root) {
	const pos = new Map();
	const reviewers = treeEntries(root).filter(({ node }) => TREE.has(node.role)).map(({ node }) => shownReviews(node).length);
	const rowHeight = 96 + Math.max(0, Math.ceil(Math.max(0, ...reviewers) / 7) - 1) * 23;
	let nextRow = 0;
	function place(node, depth) {
		const children = treeChildren(node).map((child) => place(child, depth + 1));
		const y = children.length ? (children[0].y + children.at(-1).y) / 2 : 74 + rowHeight * nextRow++;
		const point = { node, x: 26 + depth * COLUMN_WIDTH, y, depth };
		pos.set(node.id, point);
		return point;
	}
	place(root, 0);
	const depth = Math.max(0, ...[...pos.values()].map((p) => p.depth));
	return { pos, depth, height: 70 + rowHeight * nextRow, width: (depth + 1) * COLUMN_WIDTH };
}

function treeConnection(p, q) {
	const mid = q.x - 22;
	return `M${p.x + 13} ${p.y} H${mid} V${q.y} H${q.x - 12}`;
}

function graphNode(point, family) {
	const { node, x, y } = point;
	const st = S.state;
	const title = nodeDisplayName(node);
	const selected = S.sel === node.id;
	const dim = family && !family.has(node.id);
	const branch = st.sub[node.id];
	const budget = node.budget.tokens;
	const tokens = `${kfmt(st.own[node.id])} own · ${kfmt(branch)} branch${budget ? ` / ${kfmt(budget)}` : ""}`;
	const state = agentStatus(node);
	return `<g class="gnode ${node.role} s-${esc(state.kind)} ${selected ? "sel" : ""} ${dim ? "faded" : ""}" data-id="${esc(node.id)}" transform="translate(${x} ${y})" role="button" tabindex="0" aria-label="${esc(`${ROLE_NAME[node.role]}: ${title}, ${state.label}`)}">
		<title>${esc(title)} · ${esc(activityLabel(node))}</title>
		<rect x="-16" y="-22" width="${COLUMN_WIDTH - 26}" height="55" fill="transparent"/>
		<circle class="halo" r="17"/>
		<circle class="body" r="${node.role === "root" ? "12" : "10"}"/>${node.role === "root" ? '<circle class="core" r="4"/>' : ""}
		<text class="glabel strong" x="21" y="-8">${esc(shortLabel(title, 31))}</text>
		<text class="gsub" x="21" y="8"${budget && branch > budget ? ' style="fill:var(--cut)"' : ""}>${esc(tokens)}</text>
		<text x="21" y="25"><tspan class="gstate">${esc(state.label)}</tspan><tspan class="gsub" dx="5">${esc(shortLabel(activityLabel(node), 24))}</tspan></text>
	</g>`;
}

function reviewNodes(point, family) {
	const reviews = shownReviews(point.node);
	const dim = family && !family.has(point.node.id);
	const counts = {};
	return reviews.map((reviewer, index) => {
		const x = point.x + 21 + (index % 7) * 27, y = point.y + 47 + Math.floor(index / 7) * 23;
		const label = REV_LETTER[reviewer.role];
		const order = (counts[label] ?? 0) + 1;
		counts[label] = order;
		const name = `${nodeDisplayName(reviewer)} · ${reviewer.status}`;
		return `<path class="rlink ${!LIVE.has(reviewer.status) ? "old" : ""} ${dim ? "faded" : ""}" d="M${point.x} ${point.y + 12} V${y} H${x - 10}"/>
			<g class="rnode s-${esc(reviewer.status)} ${S.sel === reviewer.id ? "sel" : ""} ${dim ? "faded" : ""}" data-id="${esc(reviewer.id)}" transform="translate(${x} ${y})" role="button" tabindex="0" aria-label="${esc(name)}">
				<title>${esc(name)} · ${fmt(S.state.own[reviewer.id])} tokens</title>
				<rect class="rhalo" x="-13" y="-12" width="26" height="24" rx="6"/>
				<rect class="rbody" x="-10.5" y="-9.5" width="21" height="19" rx="4"/>
				<text y="3">${label}${order}</text>
			</g>`;
	}).join("");
}

function renderSwarm() {
	const st = S.state, stage = $("#stage");
	const root = rootOfEpoch(S.epoch ?? st.run.epoch);
	if (!root) { stage.innerHTML = '<div class="page"><p class="empty">The root agent has not started yet.</p></div>'; return; }
	const mode = S.treeMode;
	const entries = treeEntries(root);
	const agents = entries.filter(({ node }) => TREE.has(node.role));
	const level = Math.max(0, ...agents.map(({ depth }) => depth));
	const family = nodeOf(S.family);
	const familyIds = family ? new Set([family.id, ...treeChildren(family).map((node) => node.id)]) : null;
	const head = `<div class="graphHeading"><div><h1 class="view">Agent tree</h1><p class="soft">${agents.length} agents · ${entries.length - agents.length} reviewers shown · Depth ${level} · Root cap ${root.caps.maxDepth}</p></div>
		<div class="tree-tools"><label for="treeEpoch">Epoch</label><select id="treeEpoch" onchange="pickEpoch(this.value)"><option value=""${S.epoch === null ? " selected" : ""}>Latest (${st.run.epoch})</option>${st.epochs.map((epoch) => `<option value="${epoch.number}"${epoch.number === S.epoch ? " selected" : ""}>Epoch ${epoch.number}</option>`).join("")}</select><label for="treeReviewers">Reviewers</label><select id="treeReviewers" onchange="S.reviewers=this.value;S.fitted=false;renderSwarm()">${[["all", "All"], ["live", "Active"], ["off", "Hidden"]].map(([value, label]) => `<option value="${value}"${value === S.reviewers ? " selected" : ""}>${label}</option>`).join("")}</select>
		<button type="button" class="btn ${mode === "graph" ? "primary" : ""}" aria-pressed="${mode === "graph"}" onclick="setTreeMode('graph')">Graph</button>
		<button type="button" class="btn ${mode === "outline" ? "primary" : ""}" aria-pressed="${mode === "outline"}" onclick="setTreeMode('outline')">Outline</button></div></div>`;
	const focus = family ? `<p class="row soft">Family of <b>${esc(nodeDisplayName(family))}</b><button class="linkbtn" type="button" onclick="selectFamily(null)">Clear highlight</button></p>` : "";
	if (mode === "outline") {
		const filtered = !familyIds ? entries : entries.filter(({ node }) => familyIds.has(node.id) || familyIds.has(node.targetNodeId));
		stage.innerHTML = `<div class="page monitor">${head}${focus}${agentRows(filtered, true)}</div>`;
		bindPage(stage);
		return;
	}

	const { pos, depth, width, height } = layoutTree(root);
	S.bounds = { width, height };
	if (!$("#gsvg")) {
		stage.innerHTML = `<div class="page monitor"><div id="treeControls"></div><div class="graph" id="graph">
			<div class="gtools"><div class="group"><button type="button" onclick="zoomBy(1.25)" aria-label="Zoom in">+</button><button type="button" onclick="zoomBy(0.8)" aria-label="Zoom out">−</button><button type="button" onclick="S.userMoved=false;fit()">Fit</button></div></div>
			<svg id="gsvg" role="group" aria-label="Agent tree graph"><g id="gview"></g></svg>
		</div><div class="graphKey"><span>Solid lines connect parents to children</span><span>Dashed lines connect reviewers</span><span><b>H</b> hidden</span><span><b>C</b> claims</span><span><b>E</b> epoch</span><span>Shift-click highlights a family</span></div></div>`;
		attachPanZoom($("#graph"));
	}
	const controls = $("#treeControls");
	const controlHTML = head + focus;
	if (controls.dataset.content !== controlHTML) { controls.innerHTML = controlHTML; controls.dataset.content = controlHTML; }

	const layers = Array.from({ length: depth + 1 }, (_, index) => {
		const x = COLUMN_WIDTH * index;
		const label = index === 0 ? "Root" : `Depth ${index}`;
		return `<text class="layer-name" x="${x + 14}" y="26">${label}</text>${index ? `<line class="layer" x1="${x - 14}" x2="${x - 14}" y1="12" y2="${height - 10}"/>` : ""}`;
	}).join("");
	const edges = [...pos.values()].flatMap((point) => treeChildren(point.node).map((child) => {
		const highlight = familyIds?.has(point.node.id) && familyIds.has(child.id);
		return `<path class="link ${highlight ? "hi" : familyIds ? "faded" : ""}" d="${treeConnection(point, pos.get(child.id))}"/>`;
	})).join("");
	const view = $("#gview");
	const graphHTML = layers + edges + [...pos.values()].map((point) => reviewNodes(point, familyIds) + graphNode(point, familyIds)).join("");
	if (view.dataset.content !== graphHTML) {
		view.innerHTML = graphHTML;
		view.dataset.content = graphHTML;
		for (const el of view.querySelectorAll("[data-id]")) {
			const select = (event) => {
				event.stopPropagation();
				const node = nodeOf(el.dataset.id);
				if (event.shiftKey && TREE.has(node.role)) selectFamily(treeChildren(node).length ? node.id : node.parentId ?? null);
				else selectNode(node.id);
			};
			el.onclick = select;
			el.onkeydown = (event) => { if (event.key === "Enter" || event.key === " ") { event.preventDefault(); select(event); } };
		}
	}
	if (!S.fitted || !S.userMoved) {
		S.fitted = true;
		S.userMoved = false;
		requestAnimationFrame(fit);
	} else applyZoom();
}

function setTreeMode(mode) {
	S.treeMode = mode;
	S.fitted = false;
	S.graphResize?.disconnect();
	renderSwarm();
}
function pickEpoch(number) { S.epoch = number === "" ? null : Number(number); S.family = null; S.fitted = false; renderSwarm(); }
function attachPanZoom(graph) {
	let drag;
	S.graphResize?.disconnect();
	S.graphResize = new ResizeObserver(() => { if (!S.userMoved) fit(); });
	S.graphResize.observe(graph);
	graph.addEventListener("wheel", (event) => {
		if (!event.ctrlKey && !event.metaKey) return;
		event.preventDefault();
		const rect = graph.getBoundingClientRect();
		zoomBy(Math.exp(-event.deltaY * 0.0015), event.clientX - rect.left, event.clientY - rect.top);
	}, { passive: false });
	graph.addEventListener("pointerdown", (event) => {
		if (event.target.closest("[data-id], .gtools") || event.button !== 0) return;
		drag = { x: event.clientX, y: event.clientY, zx: S.zoom.x, zy: S.zoom.y };
		graph.classList.add("drag");
		graph.setPointerCapture(event.pointerId);
	});
	graph.addEventListener("pointermove", (event) => {
		if (!drag) return;
		S.zoom.x = drag.zx + event.clientX - drag.x;
		S.zoom.y = drag.zy + event.clientY - drag.y;
		S.userMoved = true;
		applyZoom();
	});
	const endDrag = () => { drag = null; graph.classList.remove("drag"); };
	graph.addEventListener("pointerup", endDrag);
	graph.addEventListener("pointercancel", endDrag);
}
function applyZoom() {
	const view = $("#gview");
	if (view) view.setAttribute("transform", `translate(${S.zoom.x.toFixed(1)} ${S.zoom.y.toFixed(1)}) scale(${S.zoom.k.toFixed(3)})`);
}
function fit() {
	const graph = $("#graph"), b = S.bounds;
	if (!graph || !b || !graph.clientWidth || !graph.clientHeight) return;
	const w = graph.clientWidth - 36, h = graph.clientHeight - 72;
	const k = Math.min(1.2, Math.max(0.14, Math.min(w / b.width, h / b.height)));
	S.zoom = { k, x: (graph.clientWidth - b.width * k) / 2, y: 55 + Math.max(0, (h - b.height * k) / 2) };
	applyZoom();
}
function zoomBy(factor, x, y) {
	const graph = $("#graph");
	if (!graph) return;
	const cx = x ?? graph.clientWidth / 2, cy = y ?? graph.clientHeight / 2;
	const prev = S.zoom, k = Math.min(3, Math.max(0.14, prev.k * factor));
	S.zoom = { k, x: cx - (cx - prev.x) * k / prev.k, y: cy - (cy - prev.y) * k / prev.k };
	S.userMoved = true;
	applyZoom();
}
function reviewerOutcome(r) {
	const st = S.state;
	if (r.role === "hidden_reviewer") { const rec = st.recommendations.find((x) => x.reviewerNodeId === r.id); return rec ? `recommended ${rec.action.replace(/_/g, " ")} (grade ${rec.grade.toFixed(2)}, promise ${rec.promise.toFixed(2)})` : null; }
	if (r.role === "claims_reviewer") { for (const f of st.findings) { const round = f.rounds.find((x) => x.reviewerNodeId === r.id); if (round) return `${round.verdict.replace(/_/g, " ")}${round.confidence !== undefined ? ` at ${round.confidence.toFixed(2)}` : ""} on round ${round.round}`; } return null; }
	if (r.role === "root_reviewer") return r.finishedSummary ?? null;
	return null;
}
// ---------- agent inspection ----------
function selectNode(id) {
	if (S.sel !== id) S.drawerTab = "overview";
	S.sel = id; S.selFinding = null; openDrawer(); renderAll();
}
function selectFamily(headId) { S.family = headId; if (headId) { S.view = S.view === "families" ? "families" : "swarm"; } renderAll(); }
function selectFinding(id) { S.selFinding = id; S.sel = null; openDrawer(); renderDrawer(); }
function openDrawer() { $("#drawer").classList.add("open"); }
function closeDrawer() { $("#drawer").classList.remove("open"); S.sel = null; S.selFinding = null; if (S.view === "swarm") renderSwarm(); }
function setTab(t) { S.drawerTab = t; renderDrawer(); }

async function renderDrawer() {
	const box = $("#dinner");
	if (S.selFinding) return renderFindingDrawer(box);
	const n = S.sel && nodeOf(S.sel);
	if (!n) { $("#drawer").classList.remove("open"); return; }
	const isRev = !TREE.has(n.role);
	const tabs = isRev ? [["overview", "Overview"], ["activity", "Activity"]] : [["overview", "Overview"], ["activity", "Activity"], ["family", "Family"], ["findings", "Findings"], ["board", "Board"], ["reviews", "Reviews"]];
	const tab = tabs.some(([k]) => k === S.drawerTab) ? S.drawerTab : "overview";
	const previous = S.lastDrawer === `${n.id}:${tab}` ? $("#dbody") : null;
	const keep = previous?.scrollTop ?? 0;
	const openDetails = previous && [...previous.querySelectorAll("details")].filter((detail) => detail.open).map((detail) => $("summary", detail)?.textContent);
	S.lastDrawer = `${n.id}:${tab}`;
	box.innerHTML = `<div class="dhead"><div class="kicker">${esc(ROLE_NAME[n.role])}${n.epoch ? ` · epoch ${n.epoch}` : ""} ${statusChip(n.status)}<button class="close" onclick="closeDrawer()" aria-label="Close">×</button></div>
		<h2>${esc(nodeDisplayName(n))}</h2><div class="dim" style="font-size:12.5px">${esc(n.model ? `${n.model.provider} / ${n.model.id}` : "Model pending")}</div></div>
		<div class="tabs">${tabs.map(([k, l]) => `<button class="${k === tab ? "on" : ""}" onclick="setTab('${k}')">${l}</button>`).join("")}</div>
		<div class="dbody" id="dbody">${tab === "activity" ? '<p class="dim">Loading…</p>' : drawerTab(n, tab)}</div>`;
	const body = $("#dbody");
	if (tab === "activity") {
		try {
			const activity = await activityTab(n);
			if (body.isConnected) body.innerHTML = activity;
		} catch (error) {
			if (body.isConnected) body.innerHTML = `<p class="empty">Could not load activity. ${esc(error.message)}</p>`;
		}
	}
	if (openDetails?.length) for (const detail of body.querySelectorAll("details")) detail.open = openDetails.includes($("summary", detail)?.textContent);
	body.scrollTop = keep;
	bindPage(box);
}
function drawerTab(n, tab) {
	const st = S.state;
	const last = st.series.activity?.[n.id];
	const now = `<div class="agent-now"><h3>${LIVE.has(n.status) ? "Current activity" : "Last activity"}</h3><p class="prose">${esc(activityLabel(n))}</p>${last ? `<p class="dim">${relativeTime(last)}</p>` : ""}${n.checkpoint ? `<details><summary>Latest checkpoint</summary><div class="box prose">${esc(n.checkpoint)}</div></details>` : ""}</div>`;
	if (tab === "overview" && !TREE.has(n.role)) {
		const target = nodeOf(n.targetNodeId);
		const out = reviewerOutcome(n);
		const finding = n.targetFindingId ? st.findings.find((f) => f.id === n.targetFindingId) : null;
		return `${now}<div class="gauges"><div class="gauge"><b class="num">${kfmt(st.own[n.id])}</b><span>tokens it spent</span></div><div class="gauge"><b class="num">${n.turns}</b><span>turns</span></div><div class="gauge"><b>${esc(n.status)}</b><span>${ago(n.createdAt)}</span></div></div>
			<h3>Reviewing</h3><div class="mlist">${target ? `<div class="mrow" data-node="${esc(target.id)}"><span class="dot st s-${target.status}"></span><span class="t">${esc(target.goal.title)}</span><span class="num dim">${kfmt(st.own[target.id])} own</span><span class="a">${esc(ROLE_NAME[target.role])} · ${esc(target.status)}</span></div>` : "<p class='dim'>unknown</p>"}</div>
			${finding ? `<h3>The finding under review</h3><div class="find" data-finding="${esc(finding.id)}" style="grid-template-columns:96px 1fr">${`<div>${statusChip(finding.status)}</div><div><div class="lvl">${esc(finding.level.replace(/_/g, " "))}</div><div class="claim">${esc(finding.claim)}</div></div>`}</div>` : ""}
			<h3>Outcome</h3><p class="prose">${esc(out ?? (LIVE.has(n.status) ? "Still reviewing." : "Ended without a recorded outcome."))}</p>
			<h3>What it was asked</h3><div class="box prose" style="max-height:360px;overflow:auto">${esc(n.goal.text)}</div>
			<p class="dim" style="font-size:12px">${n.role === "hidden_reviewer" ? "The reviewed agent never sees this review; its parent decides what to do with the recommendation." : n.role === "claims_reviewer" ? "Only findings this reviewer accepts reach the author's parent." : "Root reviewers decide whether a new epoch starts."} Its spend is its own, and also counts as oversight against the reviewed agent's budget.</p>`;
	}
	if (tab === "overview") {
		const sub = st.sub[n.id], budget = n.budget?.tokens;
		const frac = budget ? sub / budget : 0;
		const c = n.contract;
		const kids = (n.children || []).filter((c) => TREE.has(nodeOf(c)?.role));
		const parent = nodeOf(n.parentId);
		const reviewers = st.reviewersOf[n.id] ?? [];
		return `${now}${parent ? `<div class="row dim">Parent ${agentLink(parent)}</div>` : ""}<div class="row dim">${kids.length ? `<button type="button" class="linkbtn" onclick="setTab('family')">${kids.length} ${kids.length === 1 ? "child" : "children"}</button>` : ""}${reviewers.length ? `<button type="button" class="linkbtn" onclick="setTab('reviews')">${reviewers.length} reviewer${reviewers.length === 1 ? "" : "s"}</button>` : ""}</div><div class="gauges">
				<div class="gauge"><b class="num">${kfmt(st.own[n.id])}</b><span>its own tokens</span></div>
				<div class="gauge"><b class="num">${kfmt(st.over[n.id])}</b><span>spent reviewing it</span></div>
				<div class="gauge"><b class="num">${kfmt(sub)}</b><span>branch total</span></div>
			</div>
			<div style="font-size:12px;color:var(--ink-3)">Budget ${budget ? `${fmt(budget)} tokens · ${(frac * 100).toFixed(0)}% used by the branch` : "unbounded"}</div>${budget ? `<div class="bar" style="margin-bottom:6px"><i style="width:${Math.min(100, frac * 100)}%"></i></div>` : ""}
			<div class="gauges"><div class="gauge"><b class="num">${n.grade !== undefined ? n.grade.toFixed(2) : "—"}</b><span>reviewer grade</span></div><div class="gauge"><b class="num">${n.promise.toFixed(2)}</b><span>promise (priority)</span></div><div class="gauge"><b class="num">${n.turns}</b><span>turns</span></div></div>

	}
	if (tab === "family") {
		const anc = lineage(n.id);
		const sibs = n.parentId ? (nodeOf(n.parentId)?.children || []).map(nodeOf).filter((m) => m && TREE.has(m.role)) : [];

		const row = (m) => `<div class="mrow" data-node="${esc(m.id)}"><span class="dot st s-${m.status}"></span><span class="t">${esc(m.goal.title)}${m.id === n.id ? ' <span class="dim">(this agent)</span>' : ""}</span><span class="num dim">${kfmt(st.sub[m.id])}</span><span class="a">${esc(ROLE_NAME[m.role])} · ${esc(m.status)}${m.activity ? ` · ${esc(m.activity)}` : ""}</span></div>`;
		return `<h3 style="margin-top:4px">Lineage</h3><div class="crumbs">${anc.length ? anc.map((a) => `<button data-node="${esc(a.id)}">${esc(a.goal.title)}</button><span class="sep">›</span>`).join("") : ""}<b>${esc(n.goal.title)}</b></div>
			${n.parentId ? `<h3>Family it belongs to · ${sibs.length} siblings</h3><div class="row" style="margin-bottom:10px"><button class="btn ${S.family === n.parentId ? "focus" : ""}" onclick="selectFamily('${esc(n.parentId)}')">Highlight this family</button></div><div class="mlist">${sibs.map(row).join("")}</div>` : ""}
			${kids.length ? `<h3>Family it heads · ${kids.length} children</h3><div class="row" style="margin-bottom:10px"><button class="btn ${S.family === n.id ? "focus" : ""}" onclick="selectFamily('${esc(n.id)}')">Highlight this family</button></div><div class="mlist">${kids.map(row).join("")}</div>` : `<p class="dim">${n.role === "leaf" ? "Workers do not spawn children." : "No children yet."}</p>`}`;

	if (tab === "reviews") {
		const recs = st.recommendations.filter((r) => r.targetNodeId === n.id).sort((a, b) => b.createdAt - a.createdAt);

}

async function activityTab(n) {
	const evs = await api(`/api/runs/${encodeURIComponent(S.runId)}/events?node=${encodeURIComponent(n.id)}&limit=200&types=agent.message,tool.call,tool.result,node.delivered,agent.error,agent.retry,review.started,finding.verdict,question.asked`);
	if (!evs.length) return `<p class="empty">Nothing yet. Activity appears here as the agent thinks, calls tools and receives messages.</p>`;
	const items = evs.slice(-120).reverse().map((e) => {
		const d = e.data, t = new Date(e.ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit", second: "2-digit" });
		if (e.type === "agent.message") {
			const parts = [];
			if (d.thinking) parts.push(`<div class="ev think"><div class="meta"><b>Thinking</b> · ${t}</div><details class="fold"><summary class="prose soft">${esc(String(d.thinking).slice(0, 220))}<span class="more">${String(d.thinking).length > 220 ? " … more" : ""}</span></summary><div class="prose soft">${esc(String(d.thinking).slice(220))}</div></details></div>`);
			if (d.text) parts.push(`<div class="ev"><div class="meta"><b>Says</b> · ${t}</div><div class="prose">${esc(d.text)}</div></div>`);
			if (d.error) parts.push(`<div class="ev err"><div class="meta"><b>Model error</b> · ${t}</div><div class="prose">${esc(d.error)}</div></div>`);
			return parts.join("");
		}
		if (e.type === "tool.call") return `<div class="ev tool"><div class="meta"><b>Calls ${esc(d.tool)}</b> · ${t}</div><details class="fold"><summary class="code soft">${esc(JSON.stringify(d.args).slice(0, 140))}<span class="more">${JSON.stringify(d.args).length > 140 ? " … more" : ""}</span></summary><div class="pre">${esc(JSON.stringify(d.args, null, 2))}</div></details></div>`;
		if (e.type === "tool.result") return `<div class="ev ${d.isError ? "err" : "res"}"><div class="meta"><b>${esc(d.tool)} ${d.isError ? "failed" : "returned"}</b> · ${t}</div><details class="fold"><summary class="code soft">${esc(String(d.text).slice(0, 160))}<span class="more">${String(d.text).length > 160 ? " … more" : ""}</span></summary><div class="pre">${esc(d.text)}</div></details></div>`;
		if (e.type === "node.delivered") return `<div class="ev msg"><div class="meta"><b>Message in</b> · ${t}</div><div class="prose soft">${esc(d.text)}</div></div>`;
		if (e.type === "agent.error") return `<div class="ev err"><div class="meta"><b>Error</b> · ${t}</div><div class="prose">${esc(d.error)}</div></div>`;
		if (e.type === "agent.retry") return `<div class="ev err"><div class="meta"><b>Retrying</b> · ${t}</div><div class="prose soft">attempt ${esc(d.attempt)} after ${dur(d.delayMs)}</div></div>`;
		return `<div class="ev"><div class="meta"><b>${esc(e.type)}</b> · ${t}</div><div class="prose soft">${esc(d.reason ?? d.question ?? d.verdict ?? "")}</div></div>`;
	});
	return `<div class="tl">${items.join("")}</div>`;
}

	const fs = [...S.state.findings].sort((a, b) => order[a.status] - order[b.status] || b.updatedAt - a.updatedAt);

	if (!fs.length) return `<h1 class="view">Findings</h1><p class="empty">No findings yet. When a worker reports a result, a claims reviewer on another model checks it; only accepted findings travel up the tree.</p>`;
	return `<h1 class="view">Findings</h1><p class="lede">${count("accepted")} accepted, ${count("needs_work")} sent back for more work, ${count("pending_review")} under review, ${count("rejected")} rejected${count("unreviewed") ? `, ${count("unreviewed")} closed unreviewed when the run ended` : ""}. Bars show each review round.</p>
		${fs.map((f) => `<div class="find" data-finding="${esc(f.id)}"><div>${statusChip(f.status)}<div class="steps">${f.rounds.map((r) => `<i class="s-${r.verdict}" title="round ${r.round}: ${esc(r.verdict)}"></i>`).join("")}</div></div><div><div class="lvl">${esc(f.level.replace(/_/g, " "))}${f.confidence !== undefined ? ` · confidence ${f.confidence.toFixed(2)}` : ""}</div><div class="claim">${esc(f.claim)}</div></div><div class="dim" style="font-size:12.5px;text-align:right">${esc(titleOf(f.nodeId))}<br>${ago(f.updatedAt)}</div></div>`).join("")}`;

function boardFeed(posts, limit) {

	const others = posts.filter((p) => p.kind !== "checkpoint").slice(-limit).reverse();
	const initials = (id) => esc(titleOf(id).split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase());
	return `${latest.size ? `<div class="cps" style="margin-bottom:14px">${[...latest.values()].map((p) => `<div class="cp s-${nodeOf(p.authorNode)?.status ?? "done"}" style="--c:var(--c)"><div class="who"><button class="linkbtn" data-node="${esc(p.authorNode)}" style="color:var(--ink);font-weight:600">${esc(titleOf(p.authorNode))}</button></div><div class="dim" style="font-size:11.5px">checkpoint · ${ago(p.createdAt)}</div><div class="prose soft" style="font-size:13px;margin-top:4px">${esc(p.body)}</div></div>`).join("")}</div>` : ""}
		${others.map((p) => `<div class="post ${esc(p.kind)}"><div class="avatar">${initials(p.authorNode)}</div><div><div class="kind">${esc(p.kind.replace(/_/g, " "))} · <span class="dim" style="text-transform:none">${ago(p.createdAt)}</span></div><div><b>${esc(p.title)}</b> <span class="dim">by</span> <button class="linkbtn" data-node="${esc(p.authorNode)}">${esc(titleOf(p.authorNode))}</button></div><div class="prose soft">${esc(p.body)}</div></div></div>`).join("")}`;
}

function hbars(items, max) {

function lineChart(points, opts) {
	const W = 900, H = 230, L = 52, R = 16, T = 14, B = 26;
	if (points.length < 2) return `<p class="empty">The curve appears once the swarm has made a few model calls.</p>`;
	const x0 = points[0][0], x1 = Math.max(points.at(-1)[0], x0 + 1000);
	const ymax = Math.max(opts.cap ?? 0, ...points.map((p) => p[1])) * 1.06 || 1;
	const X = (t) => L + ((t - x0) / (x1 - x0)) * (W - L - R), Y = (v) => T + (1 - v / ymax) * (H - T - B);
	const d = points.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(" ");
	const ticks = [0, 0.25, 0.5, 0.75, 1].map((f) => ymax * f);
	let g = ticks.map((v) => `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${kfmt(v)}</text>`).join("");
	if (opts.cap) g += `<line x1="${L}" x2="${W - R}" y1="${Y(opts.cap)}" y2="${Y(opts.cap)}" stroke="var(--ink)" stroke-dasharray="5 4"/><text x="${W - R}" y="${Y(opts.cap) - 6}" text-anchor="end" style="fill:var(--ink)">budget ${kfmt(opts.cap)}</text>`;
	for (const m of opts.marks ?? []) if (m.t >= x0) g += `<line x1="${X(m.t)}" x2="${X(m.t)}" y1="${T}" y2="${H - B}" stroke="var(--focus)" stroke-dasharray="3 3"/><text x="${X(m.t) + 4}" y="${T + 10}" style="fill:var(--ink-2)">${esc(m.label)}</text>`;
	g += `<path d="${d} L${X(points.at(-1)[0])} ${Y(0)} L${X(points[0][0])} ${Y(0)} Z" fill="color-mix(in oklch, var(--ink) 6%, transparent)"/><path d="${d}" fill="none" stroke="var(--ink)" stroke-width="2"/>`;
	for (const a of opts.dots ?? []) if (a >= x0) g += `<circle cx="${X(a)}" cy="${H - B}" r="4" fill="var(--done)"/>`;
	g += `<text x="${L}" y="${H - 6}">0</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${dur(x1 - x0)}</text>`;
	return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(opts.label)}">${g}</svg>`;
}
function stepChart(series, opts) {
	const W = 900, H = 200, L = 40, R = 16, T = 14, B = 26;
	const all = series.flatMap((x) => x.points);
	if (all.length < 2) return `<p class="empty">Appears once agents start launching.</p>`;
	const x0 = Math.min(...all.map((p) => p[0])), x1 = Math.max(x0 + 1000, ...all.map((p) => p[0]));
	const ymax = Math.max(1, ...all.map((p) => p[1])) * 1.1;
	const X = (t) => L + ((t - x0) / (x1 - x0)) * (W - L - R), Y = (v) => T + (1 - v / ymax) * (H - T - B);
	let g = [0, 0.5, 1].map((f) => `<line x1="${L}" x2="${W - R}" y1="${Y(ymax * f)}" y2="${Y(ymax * f)}" stroke="var(--line)"/><text x="${L - 8}" y="${Y(ymax * f) + 4}" text-anchor="end">${Math.round(ymax * f)}</text>`).join("");
	for (const sr of series) {
		if (!sr.points.length) continue;
		let d = `M${X(sr.points[0][0])} ${Y(0)}`;

function md(text) {
	const lines = esc(text).split("\n"); let out = "", code = false, table = false, list = false;

		if (/^\|.*\|$/.test(tl)) { if (/^\|[\s:|-]+\|$/.test(tl)) continue; if (!table) { out += "<table>"; table = true; } out += `<tr>${tl.slice(1, -1).split(/(?<!\\)\|/).map((c) => `<td>${inl(c.trim())}</td>`).join("")}</tr>`; continue; }
		if (table) { out += "</table>"; table = false; }

		if (h) { out += `<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`; continue; }
