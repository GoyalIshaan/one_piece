<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>one_piece v2 Dashboard</title>
	<style>
		:root { color-scheme: dark; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
		body { margin: 0; background: #0b0e14; color: #e6edf3; }
		header { padding: 14px 20px; border-bottom: 1px solid #1f2633; display: flex; justify-content: space-between; align-items: center; }
		main { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 54px); }
		aside { border-right: 1px solid #1f2633; padding: 14px; overflow-y: auto; }
		section { padding: 18px 22px; overflow-y: auto; }
		.card { background: #121722; border: 1px solid #1f2633; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
		.run-btn { width: 100%; text-align: left; background: #121722; color: inherit; border: 1px solid #263042; border-radius: 6px; padding: 10px; margin-bottom: 8px; cursor: pointer; }
		.run-btn.active { border-color: #58a6ff; background: #172033; }
		.pill { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 99px; background: #222c3f; margin-right: 6px; }
		pre { background: #0d1118; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; }
		table { width: 100%; border-collapse: collapse; font-size: 13px; }
		th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #1f2633; }
	</style>
</head>
<body>
	<header>
		<strong>one_piece v2 · Topology &amp; Multi-CLI Swarm OS</strong>
		<span id="status-line" class="pill">loading…</span>
	</header>
	<main>
		<aside>
			<h3 style="margin-top:0">Runs</h3>
			<div id="runs-list"></div>
		</aside>
		<section id="run-detail">
			<div class="card">Select a run to inspect agents, tasks, findings, quotas, and live events.</div>
		</section>
	</main>
	<script data-typecheck="v2-dashboard">
		// @ts-check
		/** @typedef {{ id: string; topology: string; status: string; goal: { title: string }; nominatedFindingId?: string }} RunSummary */
		/** @typedef {{ seq: number; ts: number; type: string; nodeId?: string; data: Record<string, unknown> }} RunEvent */

		/** @type {string | null} */
		let selectedRunId = null;

		/** @param {string} text */
		function escapeHtml(text) {
			return text.replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch] || ch));
		}

		async function refreshRuns() {
			const res = await fetch("/api/runs");
			/** @type {{ runs: RunSummary[] }} */
			const data = await res.json();
			const container = document.getElementById("runs-list");
			const status = document.getElementById("status-line");
			if (status) status.textContent = `${data.runs.length} runs`;
			if (!container) return;
			container.innerHTML = data.runs.map((r) => `
				<button class="run-btn ${r.id === selectedRunId ? "active" : ""}" data-run-id="${escapeHtml(r.id)}">
					<div><strong>${escapeHtml(r.goal.title.slice(0, 48))}</strong></div>
					<div style="margin-top:4px"><span class="pill">${escapeHtml(r.topology)}</span><span class="pill">${escapeHtml(r.status)}</span></div>
				</button>
			`).join("") || "<p>No runs recorded yet.</p>";
			for (const btn of container.querySelectorAll("button[data-run-id]")) {
				btn.addEventListener("click", () => {
					const id = btn.getAttribute("data-run-id");
					if (id) void selectRun(id);
				});
			}
			if (!selectedRunId && data.runs[0]) void selectRun(data.runs[0].id);
		}

		/** @param {string} runId */
		async function selectRun(runId) {
			selectedRunId = runId;
			const [detailRes, evRes] = await Promise.all([
				fetch(`/api/runs/${encodeURIComponent(runId)}`),
				fetch(`/api/runs/${encodeURIComponent(runId)}/events?limit=60`),
			]);
			const detail = await detailRes.json();
			/** @type {{ events: RunEvent[] }} */
			const evData = await evRes.json();
			const root = document.getElementById("run-detail");
			if (!root) return;
			root.innerHTML = `
				<div class="card">
					<h2 style="margin:0 0 8px 0">${escapeHtml(String(detail.run.goal.title))}</h2>
					<span class="pill">topology: ${escapeHtml(String(detail.run.topology))}</span>
					<span class="pill">status: ${escapeHtml(String(detail.run.status))}</span>
					<span class="pill">nominated: ${escapeHtml(String(detail.run.nominatedFindingId || "none"))}</span>
				</div>
				<div class="card">
					<h3 style="margin-top:0">Agents (${detail.agents.length})</h3>
					<table><thead><tr><th>ID</th><th>Role</th><th>Driver</th><th>Status</th><th>Turns</th></tr></thead>
					<tbody>${detail.agents.map((/** @type {any} */ a) => `<tr><td>${escapeHtml(a.handle)}</td><td>${escapeHtml(a.role)}</td><td>${escapeHtml(a.driverId)}</td><td>${escapeHtml(a.status)}</td><td>${a.turns}</td></tr>`).join("")}</tbody></table>
				</div>
				<div class="card">
					<h3 style="margin-top:0">Findings (${detail.findings.length})</h3>
					<table><thead><tr><th>ID</th><th>Status</th><th>Author</th><th>Claim</th></tr></thead>
					<tbody>${detail.findings.map((/** @type {any} */ f) => `<tr><td>${escapeHtml(f.id)}</td><td>${escapeHtml(f.status)}</td><td>${escapeHtml(f.authorDriverId || f.authorAgentId)}</td><td>${escapeHtml(f.claim)}</td></tr>`).join("")}</tbody></table>
				</div>
				<div class="card">
					<h3 style="margin-top:0">Recent Events (${evData.events.length})</h3>
					<pre>${escapeHtml(evData.events.slice(-30).map((e) => `#${e.seq} ${e.type} ${e.nodeId || ""} ${JSON.stringify(e.data)}`).join("\n"))}</pre>
				</div>
			`;
		}

		void refreshRuns();
		setInterval(() => {
			void refreshRuns();
			if (selectedRunId) void selectRun(selectedRunId);
		}, 3000);
	</script>
</body>
</html>
